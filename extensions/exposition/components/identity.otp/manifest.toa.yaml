namespace: identity
name: otp

entity:
  properties:
    authority:
      type: string
    username:
      type: string
      minLength: 1
      maxLength: 256
    identity:
      type: string
      pattern: ^[0-9a-f]{32}$
  required:
    - authority
    - username

operations:
  issue:
    input:
      properties:
        authority:
          type: string
        username:
          type: string
          minLength: 1
          maxLength: 256
        identity:
          type: string
          pattern: ^[0-9a-f]{32}$
        lifetime:
          description: OTP expiration time in seconds
          type: number
          minimum: 1
          maximum: 3600
      required:
        - authority
        - username
      type: object
  authenticate:
    input:
      properties:
        authority:
          type: string
        credentials:
          type: string
      required:
        - authority
        - credentials
      type: object
    output:
      properties:
        identity:
          properties:
            id:
              type: string
          type: object
      type: object
    errors:
      - INVALID_CREDENTIALS
      - EXPIRED
      - TOO_MANY_ATTEMPTS
      - NOT_FOUND

configuration:
  schema:
    properties:
      lifetime:
        description: OTP expiration time in seconds
        type: number
        minimum: 1
        maximum: 3600
      attempts:
        description: Failed authentication attempts allowed per username within `lifetime`
        type: integer
        minimum: 1
    type: object

  defaults:
    lifetime: 300
    attempts: 5

stash: ~

exposition:
  /:identity:
    auth:id: identity
    auth:role: system:identity:otp
    POST:
      io:input: []
      io:output: [code]
      map:authority: authority
      map:segments:
        username: identity
      endpoint: issue
