name: fetch

operations:
  request:
    input:
      type: object
      properties:
        method:
          type: string
        retry:
          type: object
          properties:
            attempts:
              type: number
            expected:
              type: array
              items:
                type: number
            delay:
              type: number
            factor:
              type: number
          required:
            - attempts
      required:
        - method
    output:
      properties:
        status:
          type: number
        attempt:
          type: number
      type: object
