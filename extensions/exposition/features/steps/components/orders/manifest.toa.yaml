name: orders

entity:
  properties:
    title: &title
      type: string
    volume: &volume
      type: number
    price:
      type: number
  required:
    - title
    - volume

operations:
  create:
    concurrency: retry
    query: false
    input:
      properties:
        title: *title
        volume: *volume
      type: object
      required:
        - title
        - volume
