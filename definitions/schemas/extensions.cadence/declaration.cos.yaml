# manifest.toa.yaml cadence declaration: the operations called on a cadence or at the moments
# of a calendar, each by the entries it was given. What an entry may state is its kind's own
# schema, `pulse` or `schedule`.
type: object
propertyNames:
  pattern: ^[a-zA-Z]+([_a-zA-Z0-9]*[a-zA-Z0-9]+)?$
patternProperties:
  ".*":
    type: array
    minItems: 1
    items:
      type: object
