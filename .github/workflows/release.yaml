name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - release
      - alpha

  workflow_dispatch:
    inputs:
      from-package:
        description: Publish versions already in package.json (no version bump)
        required: true
        default: true
        type: boolean
      dist-tag:
        description: npm dist-tag for from-package publish
        required: true
        default: alpha
        type: string

permissions: {}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write

    # what the scripts branch on reaches the shell as a variable, never spliced into the text
    env:
      EVENT: ${{ github.event_name }}
      BASE_REF: ${{ github.base_ref }}
      FROM_PACKAGE: ${{ inputs.from-package }}
      DIST_TAG_INPUT: ${{ inputs.dist-tag }}

    steps:
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm
        run: npm i -g npm@latest

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Import GPG key
        if: github.event_name != 'workflow_dispatch' || inputs.from-package == false
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.TOABOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.TOABOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ steps.gpg.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.gpg.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.gpg.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.gpg.outputs.email }}
          HUSKY: 0
        run: |
          # no dependency runs a script while the publishing credentials are in scope; the
          # build that `postinstall` would have run is invoked by name
          npm ci --ignore-scripts
          npm run transpile

          # Versioning and publishing are one command no longer. `lerna publish` reads the
          # `ignoreScripts` of `command.version` as its own, so it skipped `prepack` too and
          # a package shipped without what that script builds. Versioning still ignores
          # scripts, as it is meant to; publishing says so explicitly.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FROM_PACKAGE" = "true" ]; then
            DIST_TAG=$DIST_TAG_INPUT
          elif [ "$BASE_REF" = "release" ]; then
            DIST_TAG=latest
            npx lerna version --conventional-graduate --create-release github --no-commit-hooks --yes --message "ci: %s" --sign-git-commit
          else
            DIST_TAG=alpha
            npx lerna version --conventional-prerelease --preid alpha --create-release github --no-commit-hooks --yes --message "ci: %s" --sign-git-commit
          fi

          npx lerna publish from-package --dist-tag "$DIST_TAG" --no-ignore-scripts --yes

      # the version bump is the source of truth for the next release, so it reaches
      # `dev` as soon as publishing succeeded — an image that fails to build must not
      # strand it on the release branch alone
      - name: Push to dev branch
        if: github.event_name == 'pull_request'
        env:
          HUSKY: 0
        run: |
          git fetch
          git checkout dev

          # A release lands on the release branch as one squashed commit, so `dev`'s commits
          # are not ancestors of it and every manifest whose dependencies moved meets the same
          # block with bumped versions. What that branch holds is `dev`'s content plus the
          # bump, so it is the newer manifest, and the lockfile follows from the manifests
          # rather than from either side — it has `-merge` in .gitattributes and never merges.
          if ! git merge "$BASE_REF"; then
            git diff --name-only --diff-filter=U -- '*package.json' | xargs -r git checkout --theirs --
            git diff --name-only --diff-filter=U -- '*package.json' | xargs -r git add
            git checkout --theirs -- package-lock.json 2>/dev/null || true
            npm install --package-lock-only --ignore-scripts
            git add package-lock.json

            # anything still conflicting is code, which means `dev` moved during the release:
            # that is for a person to resolve, and the version bump is on the release branch
            # to merge from once they have
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::merging $BASE_REF into dev left conflicts outside the manifests"
              git diff --name-only --diff-filter=U
              exit 1
            fi

            git -c core.hooksPath=/dev/null commit --no-edit
          fi
          git push --all origin --no-verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # npm publish can succeed before what it published is visible to subsequent
      # registry reads (CDN lag). The image installs the whole dependency closure,
      # and `@toa.io/runtime` being visible says nothing about the packages it
      # depends on: alpha.265 failed here on `@toa.io/cli` while the runtime itself
      # was already there. Resolve exactly what the image installs, from an empty
      # directory, so neither the workspace nor its `.npmrc` takes part.
      - name: Wait for npm
        run: |
          VERSION=$(node -p "require('./runtime/runtime/package.json').version")

          cd "$(mktemp -d)"

          # A real install, not a dry run: a dry run resolves metadata and fetches no tarball,
          # so it answers that the registry knows the version while the CDN may not yet serve
          # the bytes — which is what the image build asks for a moment later, and what it
          # failed on. Its own cache, so nothing is served from what an earlier step left
          # behind, and no `-g`, so it lands in the directory above.
          # npm has taken longer than five minutes to serve a version it had published: alpha.300
          # timed out at sixty attempts, with nothing wrong but the wait
          for i in $(seq 1 180); do
            if npm install "@toa.io/runtime@$VERSION" --omit=dev --prefer-online \
              --cache "$(mktemp -d)" >/dev/null 2>&1; then
              echo "@toa.io/runtime@$VERSION installs with its dependencies"
              exit 0
            fi

            echo "waiting for @toa.io/runtime@$VERSION and its dependencies ($i/180)"
            sleep 5
          done

          echo "::error::timed out waiting for @toa.io/runtime@$VERSION on npm"
          exit 1

      - name: Publish runtime image
        run: |
          VERSION=$(node -p "require('./runtime/runtime/package.json').version")
          IMAGE=ghcr.io/toa-io/runtime
          TAGS=(--tag "$IMAGE:$VERSION")

          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAGS+=(--tag "$IMAGE:$DIST_TAG_INPUT")
          elif [ "$BASE_REF" = "release" ]; then
            TAGS+=(--tag "$IMAGE:latest")
          else
            TAGS+=(--tag "$IMAGE:alpha")
          fi

          # the builder reads the registry through its own edge, which the poll
          # above cannot warm, so a first failure is not necessarily a real one
          build () {
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --build-arg VERSION="$VERSION" \
              --provenance=false \
              "${TAGS[@]}" \
              --push \
              -f operations/image/runtime.Dockerfile \
              operations/image
          }

          for attempt in 1 2 3; do
            if build; then
              exit 0
            fi

            echo "image build failed, retrying in 30s ($attempt/3)"
            sleep 30
          done

          echo "::error::failed to build the runtime image for $VERSION"
          exit 1

      # An extension service's image is the extension on the runtime base and nothing else,
      # so every application would otherwise build the same four on every release. Published
      # here, an application with `registry.services: published` takes them as they are.
      # Built from the tarball, not the workspace: `files` decides what an application
      # would have got. Same CDN lag as above, so the install retries.
      - name: Publish extension service images
        run: |
          VERSION=$(node -p "require('./runtime/runtime/package.json').version")

          for workspace in \
            extensions/exposition \
            extensions/realtime \
            extensions/introspection \
            extensions/configuration
          do
            for attempt in 1 2 3; do
              if node operations/src/deployment/images/publish.js "$workspace" "$VERSION"; then
                continue 2
              fi

              echo "publishing $workspace failed, retrying in 30s ($attempt/3)"
              sleep 30
            done

            echo "::error::failed to publish the service image of $workspace for $VERSION"
            exit 1
          done
