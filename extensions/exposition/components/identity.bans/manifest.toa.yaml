namespace: identity
name: bans

entity:
  associated: true
  properties:
    comment:
      type: string
    banned:
      type: boolean
    originator:
      type: string
  required:
    - banned
    - originator
  blank:
    banned: false

operations:
  transit:
    concurrency: retry
    input:
      properties:
        comment:
          type: string
        banned:
          type: boolean
        originator:
          properties:
            id:
              type: string
          type: object
      type: object
      required:
        - banned
        - originator

exposition:
  isolated: true
  /:id:
    io:output: false
    auth:rule:
      role: system:identity:bans
      delegate: originator
    PUT: transit
