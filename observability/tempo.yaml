server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

# derives service graph and span metrics from incoming spans,
# writes them to Prometheus (used by the Grafana 'Service graph' tab)
metrics_generator:
  processor:
    service_graphs:
      # unpaired producer spans become edges to virtual nodes of messaging destinations
      peer_attributes:
        - messaging.destination.name
      # split graph nodes by application (service.namespace) in multi-tenant setups
      enable_client_server_prefix: true
      dimensions:
        - service.namespace
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
