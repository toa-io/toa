<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="google" content="notranslate" />

    <!-- `%sveltekit.assets%`, so they resolve under the path the page is mounted at -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon-96x96.png"
      type="image/png"
      sizes="96x96"
    />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

    <!-- what a shared link unfurls as. No `og:image`: what is here is a 180px icon, and an
         icon is not a card — an unfurler that is given one either rejects it for its size
         or draws it badly. -->
    <meta name="description" content="Resource exploration and playground" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Toa Discovery" />
    <meta property="og:description" content="Resource exploration and playground" />
    <meta name="twitter:card" content="summary" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
