context: Internationalization project
inputs:
  locale:
    input: locale
    context: BCP 47 language tag, should not be translated, always use the target language code
  native:
    input: native
    context: native name of the language in that language, should not be translated
  nav:
    list:
      input: List
      context: tab label for the component list
    map:
      input: Map
      context: tab label for the interactive map of components and their calls
    signout:
      input: Sign out
      context: button that ends the session
    filter:
      input: Filter components
      context: placeholder of the search box in the header
    halt:
      input: HALT
  halt:
    title:
      input: Suspend operations
    description:
      input: All systems will be inoperative for the interval you give, then resume automatically.
    interval:
      input: Duration
    cancel:
      input: Cancel
      context: button that closes the halt dialog without doing anything
    hold:
      input: Hold to halt
    bounds:
      input: "!js (min, max) => `${min}–${max} seconds`"
      context: hint under a number field, saying the range it accepts
    quiescence:
      input: Quiescence
    failed:
      input: The halt was not accepted. Try again.
      context: error under the halt dialog when the request is refused
mounts:
  iam: ../../@/iam/ui/intl
  introspection: ../../@/introspection/ui/intl
