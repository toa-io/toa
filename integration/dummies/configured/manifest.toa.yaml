namespace: dummies
name: configured

entity:
  storage: ~
  schema:
    properties:
      foo:
        type: string
        default: 0
      bar:
        type: string
    type: object

operations:
  transit:
    concurrency: retry
    output:
      properties:
        id:
          type: string
          default: .
        foo:
          type: string
      type: object
  underlay:
    concurrency: retry
    output:
      properties:
        foo:
          type: string
        sum:
          type: number
      type: object

configuration:
  schema:
    type: object
    properties:
      foo:
        type: string
        default: Hello
      bar:
        type: object
        properties:
          a:
            type: integer
          b:
            type: integer
        default:
          a: 1
          b: 2
