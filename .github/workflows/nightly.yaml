name: Nightly

# What a pull request does not wait for: the scenarios whose outcome something other than the
# code decides — a host on the internet, an image they boot, a lifetime they sit through. A
# failure here costs a report rather than a merge.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Start the infrastructure
        run: |
          npm run setup:mongo
          docker compose up -d --wait

      - name: Run every scenario
        run: npm run features:nightly
