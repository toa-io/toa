namespace: octets
name: tester

storages: octets

operations:
  foo: &operation
    input:
      properties:
        identity:
          type: string
        parameters:
          type: object
        steps:
          type: object
        authority:
          type: string
        storage:
          type: string
        path:
          type: string
        entry:
          type: object
      type: object
      required:
        - authority
        - storage
        - path
        - entry
  bar: *operation
  baz: *operation
  err: *operation
  id: *operation
  echo: *operation
  concat: *operation
  yield: *operation
  yex: *operation
  authority: *operation
  identity: *operation
  redirect:
    input:
      properties:
        parameters:
          type: object
          patternProperties:
            ^.+$:
              type: string
        authority:
          type: string
        path:
          type: string
      type: object
      required:
        - authority
        - path
    output:
      type: object
      properties:
        url:
          type: string
        options:
          type: object
          properties:
            method:
              type: string
            headers:
              type: object
            body:
              type: string
      required:
        - url
