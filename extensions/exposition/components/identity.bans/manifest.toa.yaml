namespace: identity
name: bans

entity:
  schema:
    properties:
      comment:
        type: string
      banned:
        type: boolean
        default: false
      originator:
        type: string
    type: object
    required:
      - banned
      - originator
  associated: true

operations:
  transit:
    concurrency: retry
    input:
      properties:
        comment:
          type: string
        banned:
          type: boolean
        originator:
          properties:
            id:
              type: string
          type: object
      type: object
      required:
        - banned
        - originator

exposition:
  isolated: true
  /:id:
    io:output: false
    auth:rule:
      role: system:identity:bans
      delegate: originator
    PUT: transit
