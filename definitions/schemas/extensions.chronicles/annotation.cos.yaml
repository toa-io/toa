# context.toa.yaml chronicles annotation
type: object
properties:
  store:
    description: Where the log is kept, by the provider that keeps it
    oneOf:
      - type: object
        properties:
          provider:
            const: clickhouse
          url:
            description: The HTTP address of ClickHouse, whose path names the database
            type: string
            format: uri
        required: [provider, url]
        additionalProperties: false
  retention:
    description: Days a row of `events` and of `encounters` is kept; absent, kept
    type: integer
    minimum: 1
  encounters:
    description: Whether the routes clients send encounters to are served
    type: boolean
  ip:
    description: >
      How much of a client's address the log keeps: its network, truncated to /24 of IPv4 and /48
      of IPv6, or all of it
    enum: [truncated, full]
required: [store]
additionalProperties: false
