name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - release
      - alpha

  workflow_dispatch:
    inputs:
      from-package:
        description: Publish versions already in package.json (no version bump)
        required: true
        default: true
        type: boolean
      dist-tag:
        description: npm dist-tag for from-package publish
        required: true
        default: alpha
        type: string

permissions: {}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write

    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm
        run: npm i -g npm@latest

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `from-package` publishes whatever versions the checked out commit happens to
      # carry, so a run started on the wrong ref republishes stale ones and reports
      # success. Only the commit lerna tagged is a release.
      - name: Verify the ref is a release commit
        if: github.event_name == 'workflow_dispatch' && inputs.from-package
        run: |
          VERSION=$(node -p "require('./lerna.json').version")

          if ! git describe --exact-match --tags HEAD 2>/dev/null | grep -qx "v$VERSION"; then
            echo "::error::'${{ github.ref_name }}' is not a release commit: HEAD carries no v$VERSION tag"
            exit 1
          fi

          echo "releasing v$VERSION from ${{ github.ref_name }}"

      - name: Import GPG key
        if: github.event_name != 'workflow_dispatch' || inputs.from-package == false
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.TOABOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.TOABOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.TOABOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ steps.gpg.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.gpg.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.gpg.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.gpg.outputs.email }}
          HUSKY: 0
        run: |
          npm ci

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.from-package }}" = "true" ]; then
            npx lerna publish from-package --dist-tag ${{ inputs.dist-tag }} --yes
            exit 0
          fi

          if [ "${{ github.base_ref }}" = "release" ]; then
            DIST_TAG=latest
            npx lerna publish --conventional-graduate --create-release github --no-commit-hooks --yes --message "ci: %s" --sign-git-commit || INCOMPLETE=1
          else
            DIST_TAG=alpha
            npx lerna publish --conventional-prerelease --preid alpha --dist-tag alpha --create-release github --no-commit-hooks --yes --message "ci: %s" --sign-git-commit || INCOMPLETE=1
          fi

          # One package failing to publish aborts every other, and the version commit and
          # its tag are pushed by then — so the release is left half done. `from-package`
          # publishes what is missing; a failure that is not transient still fails here.
          if [ -n "$INCOMPLETE" ]; then
            echo "::warning::publish did not complete, publishing the packages it left behind"
            npx lerna publish from-package --dist-tag "$DIST_TAG" --yes
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # npm publish can succeed before the version is visible to subsequent registry
      # reads (CDN lag). The image installs the runtime with its whole dependency tree,
      # so every package of this release has to be readable, not the runtime alone.
      - name: Wait for npm
        run: |
          PENDING=$(npx lerna list --json --loglevel error |
            node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).map((p) => p.name + '@' + p.version).join(' ')")

          for i in $(seq 1 36); do
            REMAINING=""

            for SPEC in $PENDING; do
              npm view "$SPEC" version >/dev/null 2>&1 || REMAINING="$REMAINING $SPEC"
            done

            PENDING=$REMAINING

            if [ -z "$PENDING" ]; then
              echo "every published version is available"
              exit 0
            fi

            echo "waiting for ($i/36):$PENDING"
            sleep 5
          done

          echo "::error::timed out waiting for npm:$PENDING"
          exit 1

      - name: Publish runtime image
        run: |
          VERSION=$(node -p "require('./runtime/runtime/package.json').version")
          IMAGE=ghcr.io/toa-io/runtime
          TAGS=(--tag "$IMAGE:$VERSION")

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAGS+=(--tag "$IMAGE:${{ inputs.dist-tag }}")
          elif [ "${{ github.base_ref }}" = "release" ]; then
            TAGS+=(--tag "$IMAGE:latest")
          else
            TAGS+=(--tag "$IMAGE:alpha")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            "${TAGS[@]}" \
            --push \
            -f operations/image/runtime.Dockerfile \
            operations/image

      - name: Push to dev branch
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.TOABOT_GITHUB_TOKEN }}
          HUSKY: 0
        run: |
          git fetch
          git checkout dev
          # package-lock.json has -merge in .gitattributes, so concurrent
          # lockfile edits (e.g. Dependabot) always conflict with the release bump.
          if ! git merge ${{ github.base_ref }}; then
            git checkout --ours package-lock.json
            npm install --package-lock-only --ignore-scripts
            git add package-lock.json
            git -c core.hooksPath=/dev/null commit --no-edit
          fi
          git push --all origin --no-verify
