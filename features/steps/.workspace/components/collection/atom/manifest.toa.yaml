name: atom

operations:
  slots:
    input:
      properties:
        total:
          type: number
      type: object
      required:
        - total
    output:
      type: array
      items:
        type: number
  locks:
    input:
      properties:
        delay:
          type: number
          default: 0
      type: object
    output:
      type: array
      items:
        type: number
  plus:
    input:
      properties:
        delay:
          type: number
          default: 0
        key:
          type: string
      type: object
      required:
        - key
    output:
      type: number
  meter:
    input:
      properties:
        name:
          type: string
        delta:
          type: number
      type: object
      required:
        - name
        - delta
    output:
      properties:
        debt:
          type: number
        adds:
          type: boolean
      type: object
      required:
        - debt
        - adds
