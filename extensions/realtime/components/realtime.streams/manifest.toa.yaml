namespace: realtime
name: streams

operations:
  create:
    input:
      properties:
        key:
          type: string
        token:
          type: string
      type: object
  push:
    bindings: ~ # only for internal use
    input:
      properties:
        data: {}
        key:
          type: string
        event:
          type: string
      type: object
      required:
        - key
        - event

configuration:
  schema:
    properties:
      maxlen:
        type: number
        default: 1000
      expire:
        type: number
        default: 300
    type: object
    # both have defaults, so the component reads them without checking
    required: [maxlen, expire]

state: ~
stash: ~

exposition:
  /:key:
    auth:id: key
    GET: create
