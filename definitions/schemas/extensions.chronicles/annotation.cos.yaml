# context.toa.yaml chronicles annotation
type: object
properties:
  store:
    description: Where the log is kept, by the provider that keeps it
    oneOf:
      - type: object
        properties:
          provider:
            const: clickhouse
          url:
            description: The HTTP address of ClickHouse, whose path names the database
            type: string
            format: uri
        required: [provider, url]
        additionalProperties: false
  retention:
    description: Days a row of the log is kept; absent, kept
    type: integer
    minimum: 1
  ingest:
    description: Whether the client route is served
    type: boolean
required: [store]
additionalProperties: false
