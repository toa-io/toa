name: sink
namespace: mongo

entity:
  associated: true
  schema:
    properties:
      count:
        type: number
        default: 0
      inc:
        type: number
        default: 0
    type: object

operations:
  increment:
    concurrency: retry
  record:
    concurrency: retry
    input:
      properties:
        inc:
          type: integer
      type: object

receivers:
  mongo.outbox.sync: increment
  mongo.outbox.incremented: record
