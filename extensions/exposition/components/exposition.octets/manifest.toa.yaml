namespace: exposition
name: octets

storages: ~

operations:
  put:
    bindings: ~
    input:
      properties:
        location:
          type: string
        accept:
          type: string
        limit:
          type: number
        trust: {}
        storage:
          type: string
        request: {}
      type: object
      required:
        - storage
        - request
    errors:
      - LOCATION_UNTRUSTED
      - LOCATION_LENGTH
      - LOCATION_UNAVAILABLE
      - INVALID_ID
  get: &simple
    bindings: ~
    input:
      properties:
        range:
          type: string
        agent:
          type: string
        storage:
          type: string
        path:
          type: string
      type: object
      required:
        - storage
        - path
  head: *simple
  delete: *simple
