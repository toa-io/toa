name: outbox
namespace: mongo

entity:
  storage: mongodb
  properties:
    foo: &foo
      type: integer
    bar: &bar
      type: string
  blank:
    foo: 0

operations:
  transit:
    concurrency: retry
    input:
      properties:
        foo: *foo
        bar: *bar
      type: object
  assign:
    input:
      properties:
        foo: *foo
        bar: *bar
      type: object
  bump:
    concurrency: retry
    input:
      properties:
        inc:
          type: integer
      type: object
