# context.toa.yaml cadence annotation
type: object
nullable: true
properties:
  discreteness:
    description: Seconds between passes over the calls waiting to be made
    type: integer
    minimum: 1
  regions:
    description: >
      The regions whose delayed calls this deployment makes, as their ranks. It makes its own
      by default, so a call is made by the region that asked for it and by no other; naming
      another region's rank is how a surviving region takes over the calls of one that is
      gone. Two regions naming one rank make every call of it twice, and nothing can see that.
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: integer
      minimum: 0
additionalProperties: false
