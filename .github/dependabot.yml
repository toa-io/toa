# Keeps the commit pins of the actions and the dependencies moving without hand work.
# Every update is a pull request into `dev` and waits for the `Test` check like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/push
      - /.github/actions/deploy
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: ci

  # The components the extensions ship are not workspaces, yet they declare the packages they import
  # at the versions the workspace does (`definitions/source/digest/packages.test.ts`). A package one
  # of them declares is listed in `components`, so that one pull request bumps it in every manifest
  # at once; bumped per directory, each half fails that test.
  - package-ecosystem: npm
    directories:
      - /
      - /extensions/*/components/*
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: build
    groups:
      components:
        group-by: dependency-name
        patterns:
          - '@aws-sdk/client-s3'
          - '@aws-sdk/lib-storage'
          - '@node-rs/bcrypt'
          - '@simplewebauthn/server'
          - cloudinary
          - jose
          - lru-cache
          - paseto
      minor-and-patch:
        update-types:
          - minor
          - patch
