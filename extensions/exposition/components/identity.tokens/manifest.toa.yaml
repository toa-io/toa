namespace: identity
name: tokens

entity:
  schema:
    properties:
      revokedAt:
        type: integer
    type: object
  associated: true

operations:
  encrypt:
    input:
      properties:
        lifetime:
          type: number
          minimum: 0
        scopes:
          type: array
          items:
            type: string
        permissions:
          type: object
          patternProperties:
            ^.*$:
              type: array
              items:
                type: string
        key:
          type: object
          properties:
            id:
              type: string
            key:
              type: string
          required:
            - id
            - key
        authority:
          type: string
        identity:
          properties:
            id:
              type: string
          additionalProperties: true
          type: object
      type: object
      required:
        - authority
        - identity
    output:
      type: string
    errors:
      - ERR_INACCESSIBLE_SCOPE
  decrypt:
    input:
      type: string
    output:
      properties:
        authority:
          type: string
        identity:
          properties:
            id:
              type: string
          additionalProperties: true
          type: object
        iat:
          type: string
        exp:
          type: string
        refresh:
          type: boolean
      type: object
    errors:
      - INVALID_TOKEN
      - INVALID_KEY
      - FORGED_KEY
  authenticate:
    input:
      properties:
        authority:
          type: string
        credentials:
          type: string
      type: object
      required:
        - authority
        - credentials
    output:
      properties:
        identity:
          properties:
            id:
              type: string
          additionalProperties: true
          type: object
        refresh:
          type: boolean
      type: object
    errors:
      - AUTHORITY_MISMATCH
      - TOKEN_REVOKED
  issue:
    input:
      type: object
      properties:
        authority:
          type: string
        identity:
          type: string
        lifetime:
          type: number
          minimum: 0
        scopes:
          type: array
          items:
            type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        label:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - authority
        - identity
        - label
    output:
      properties:
        kid:
          type: string
        exp:
          type: number
        token:
          type: string
      type: object
    errors:
      - ERR_INACCESSIBLE_SCOPE
  revoke:
    concurrency: retry

receivers:
  identity.bans.created: revoke
  identity.bans.updated: revoke

configuration:
  schema:
    type: object
    properties:
      keys:
        type: array
        minItems: 1
        contains:
          properties:
            format:
              enum:
                - jwe
        items:
          type: object
          properties:
            id:
              type: string
              minLength: 1
            key:
              type: string
            format:
              type: string
              enum:
                - jwe
                - paseto
              default: jwe
          required:
            - id
            - key
          additionalProperties: false
      lifetime:
        description: Token expiration time in seconds (default 30 days)
        type: integer
        default: 2592000
      refresh:
        description: Token refresh time in seconds (default 10 minutes)
        type: integer
        default: 600
      cache:
        description: Custom token keys LRU cache configuration
        properties:
          max:
            type: integer
            default: 1024
          ttl:
            type: integer
            default: 600000
        default: {}
    required:
      - keys

exposition:
  /:identity:
    auth:id: identity
    auth:role: system:identity:tokens
    POST:
      map:authority: authority
      io:input: [lifetime, label, scopes, permissions]
      io:output: [kid, exp, token, label]
      endpoint: issue
