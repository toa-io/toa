name: sink
namespace: mongo

entity:
  associated: true
  properties:
    count:
      type: number
    inc:
      type: number
  blank:
    count: 0
    inc: 0

operations:
  increment:
    concurrency: retry
  record:
    concurrency: retry
    input:
      properties:
        inc:
          type: integer
      type: object

receivers:
  mongo.outbox.sync: increment
  mongo.outbox.incremented: record
