{{- if .Values.map }}
# What every component of the context provides, by the version this deployment runs of it.
# Mounted rather than rendered into a workload's environment: a variable would replace every pod
# of the context on every deployment, and a pod that came up between two of them could not be
# told. Carried gzipped, because what is read here is read by a program and a ConfigMap is capped
# at a megabyte: `kubectl exec <pod> -- zcat {{ .Values.map.directory }}/{{ .Values.map.file }}`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: components
binaryData:
  {{ .Values.map.file }}: {{ .Values.map.gzip | quote }}
{{- end }}
