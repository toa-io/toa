name: pots
namespace: tea

entity:
  storage: mongodb
  schema:
    properties:
      volume:
        type: number
      booked:
        type: boolean
        default: false
      material:
        type: string
        enum:
          - glass
          - ceramic
          - steel
    type: object
    required:
      - material

operations:
  transit:
    concurrency: none
    input:
      properties:
        material:
          type: string
          default: .
        volume:
          type: string
          default: .
        booked:
          type: string
          default: .
      type: object
  same:
    input:
      type: string
      default: .material
    output:
      type: array

receivers:
  store.orders.created:
    operation: transit
    binding: amqp # avoid discovery

configuration:
  schema:
    type: object
    properties:
      step:
        type: number
        default: 0.5
