name: Publication

# `alpha` is what publishes, so a pull request into it is verified in full: every check the
# `dev` one runs, and then the scenarios, against the infrastructure a deployment connects to.
on:
  pull_request:
    # a draft is not tested: marking it ready is what starts the run
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - alpha
      - release

permissions:
  contents: read

jobs:
  unit:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Check code style
        run: npm run lint

      - name: Check types of the step definitions
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run stage tests
        run: npm run test:stage

  features:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # the deployment scenarios render a chart, and without it they read an empty stdout
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Start the infrastructure
        run: |
          npm run setup:mongo
          docker compose up -d --wait

      - name: Run scenarios
        run: npm run features
