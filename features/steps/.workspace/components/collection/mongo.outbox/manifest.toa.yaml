name: outbox
namespace: mongo

entity:
  storage: mongodb
  schema:
    properties:
      foo:
        type: integer
        default: 0
      bar:
        type: string
    type: object

operations:
  transit:
    concurrency: retry
    input:
      properties:
        foo:
          type: string
          default: .
        bar:
          type: string
          default: .
      type: object
  assign:
    input:
      properties:
        foo:
          type: string
          default: .
        bar:
          type: string
          default: .
      type: object
  bump:
    concurrency: retry
    input:
      properties:
        inc:
          type: integer
      type: object
