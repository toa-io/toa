type: object
nullable: true
properties:
  location:
    type: string
  accept:
    anyOf:
      - type: string
      - type: array
        items:
          type: string
  limit:
    type: string
    pattern: ^(\d+(\.\d+)?)([kmgtKMBGT]i?)?[bB]?$
  trust:
    type: array
    items:
      type: string
  workflow:
    anyOf:
      - type: object
        patternProperties:
          ^.+$:
            type: string
      - type: array
        items:
          type: object
          patternProperties:
            ^.+$:
              type: string
additionalProperties: false
