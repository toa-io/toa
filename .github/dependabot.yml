# Keeps the commit pins of the actions and the dependencies moving without hand work.
# Every update is a pull request into `dev`; the `Test` workflow merges one without a major
# version once it passes.
version: 2
updates:
  # `codeql-action/init` and `codeql-action/analyze` are one release in one file, and ungrouped
  # they arrive as two pull requests. Whichever merges first leaves the other holding an older
  # copy of that file, and merging that one writes `.github/workflows` — which the token the
  # `Test` workflow runs under may not do. GitHub reports such a pull request as blocked, so it
  # sits open until Dependabot rebases it. One pull request per run leaves no older copy behind.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/push
      - /.github/actions/deploy
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The components the extensions ship are not workspaces, yet they declare the packages they import
  # at the versions the workspace does (`definitions/source/digest/packages.test.ts`). A package one
  # of them declares is listed in `components`, so that one pull request bumps it in every manifest
  # at once; bumped per directory, each half fails that test.
  - package-ecosystem: npm
    directories:
      - /
      - /extensions/*/components/*
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: build
    groups:
      components:
        group-by: dependency-name
        patterns:
          - '@aws-sdk/client-s3'
          - '@aws-sdk/lib-storage'
          - '@node-rs/bcrypt'
          - '@simplewebauthn/server'
          - cloudinary
          - jose
          - lru-cache
          - paseto
      minor-and-patch:
        update-types:
          - minor
          - patch
