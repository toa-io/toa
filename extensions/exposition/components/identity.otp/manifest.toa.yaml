namespace: identity
name: otp

entity:
  schema:
    definitions:
      id:
        type: string
        pattern: ^[0-9a-f]{32}$
    type: object
    properties:
      authority:
        type: string
      username:
        type: string
        minLength: 1
        maxLength: 256
      identity:
        type: string
        pattern: ^[0-9a-f]{32}$
    required:
      - authority
      - username
  index:
    username:
      authority: asc
      username: asc

operations:
  issue:
    input:
      properties:
        authority:
          type: string
        username:
          type: string
          minLength: 1
          maxLength: 256
        identity:
          type: string
          pattern: ^[0-9a-f]{32}$
        lifetime:
          description: OTP expiration time in seconds
          type: number
          minimum: 1
          maximum: 3600
      required:
        - authority
        - username
      type: object
  authenticate:
    input:
      properties:
        authority:
          type: string
        credentials:
          type: string
      required:
        - authority
        - credentials
      type: object
    output:
      properties:
        identity:
          properties:
            id:
              type: string
          type: object
      type: object
    errors:
      - INVALID_CREDENTIALS
      - EXPIRED
      - NOT_FOUND

configuration:
  schema:
    properties:
      lifetime:
        description: OTP expiration time in seconds
        type: number
        minimum: 1
        maximum: 3600
        default: 300
    type: object

stash: ~

exposition:
  /:identity:
    auth:id: identity
    auth:role: system:identity:otp
    POST:
      io:input: []
      io:output: [code]
      map:authority: authority
      map:segments:
        username: identity
      endpoint: issue
