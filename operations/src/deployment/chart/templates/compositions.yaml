{{- range .Values.compositions }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: composition-{{ required "composition name is required" .name }}
spec:
  replicas: {{ .replicas | default 2 }}
  # A backstop for stuck rollouts only. Must stay above the `helm upgrade --timeout`
  # the deploy runs with, so a slow but progressing rollout is not marked failed.
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      toa/composition: {{ .name }}
  template:
    metadata:
      labels:
        toa/composition: {{ .name }}
        {{- range .components }}
        toa/component-{{ . }}: "1"
        {{- end }}
        {{- range .hosted }}
        toa/service-{{ . }}: "1"
        {{- end }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          {{- if .resources }}
          resources:
            {{- if or .resources.cpu .resources.memory }}
            requests:
              {{- if .resources.cpu }}
              cpu: {{ index .resources.cpu 0 }}
              {{- end }}
              {{- if .resources.memory }}
              memory: {{ index .resources.memory 0 }}
              {{- end }}
            limits:
              {{- if .resources.cpu }}
              cpu: {{ index .resources.cpu 1 }}
              {{- end }}
              {{- if .resources.memory }}
              memory: {{ index .resources.memory 1 }}
              {{- end }}
            {{- end }}
          {{- end }}          
          {{- if or .variables .services }}
          env:
            {{- if .services }}
            - name: TOA_SERVICES
              value: {{ join " " .services | quote }}
            {{- end }}
            {{- range .variables }}
            {{- include "env.var" . | indent 12 }}
            {{- end }}
          {{- end }}
          {{- if or .backends .probe }}
          ports:
            {{- range .backends }}
            - containerPort: {{ .port }}
            {{- end }}
            {{- if .probe }}
            - containerPort: {{ .probe.port }}
            {{- end }}
          {{- end }}
          {{- if .probe }}
          startupProbe:
            httpGet:
              path: {{ .probe.path }}
              port: {{ .probe.port }}
            {{- if .probe.delay }}
            initialDelaySeconds: {{ .probe.delay }}
            {{- end }}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 150
          readinessProbe:
            httpGet:
              path: {{ .probe.path }}
              port: {{ .probe.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          {{- if .mounts }}
          volumeMounts:
            {{- range .mounts }}
            - name: {{ .name }}
              mountPath: {{ .path }}
            {{- end }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: [sleep, "5"]
      terminationGracePeriodSeconds: 45
      {{- if $.Values.credentials }}
      imagePullSecrets:
        - name: {{ $.Values.credentials }}
      {{- end }}
      {{- if .mounts }}
      volumes:
        {{- range .mounts }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ .claim }}
        {{- end }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              toa/composition: {{ .name }}
---
{{- end }}
