namespace: dummies
name: configured

entity:
  storage: ~
  schema:
    foo:
      type: string
      default: 0
    bar: string

operations:
  transit:
    concurrency: retry
    output:
      id: .
      foo: string
  underlay:
    concurrency: retry
    output:
      foo: string
      sum: number

configuration:
  schema:
    type: object
    properties:
      foo:
        type: string
        default: Hello
      bar:
        type: object
        properties:
          a: { type: integer }
          b: { type: integer }
        default: { a: 1, b: 2 }
