# a component's `realtime` declaration: its routes, by the label of the event
type: object
minProperties: 1
additionalProperties:
  type: object
  properties:
    key:
      description: >-
        The properties of the event that are the keys of the streams it goes to, or literal keys:
        `~` and the key
      # a property, or `~` and at least one character of a literal
      oneOf:
        - type: string
          pattern: ^(?:[^~]|~.)
        - type: array
          items:
            type: string
            pattern: ^(?:[^~]|~.)
          minItems: 1
    expose:
      description: What of the event its streams are given; nothing is given that is not named
      type: array
      items:
        type: string
        minLength: 1
      minItems: 1
  required:
    - key
    - expose
  additionalProperties: false
