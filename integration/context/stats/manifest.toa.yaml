namespace: stats
name: stats

entity:
  associated: true
  schema:
    properties:
      messages:
        type: integer
        default: 0
      bankrupt:
        type: boolean
    type: object

operations:
  update:
    concurrency: retry
    input:
      properties:
        messages:
          type: boolean
        bankrupt:
          type: boolean
      type: object

receivers:
  messages.messages.created: update
  credits.balance.updated: update

exposition:
  /:id:
    GET: observe
    PATCH: update
