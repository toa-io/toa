{{- range .Values.components }}
apiVersion: v1
kind: Service
metadata:
  name: {{ . }}
spec:
  type: ClusterIP
  selector:
    toa/component-{{ . }}: "1"
  ports:
    # what a streamed call is dialled at; see documentation/ports.md
    - name: http-binding
      protocol: TCP
      port: 8005
      targetPort: 8005
---
{{- end }}
