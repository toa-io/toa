name: messages

entity:
  schema:
    properties:
      watchers:
        type: array
        items:
          type: string
          maxLength: 32
      sender:
        type: string
        maxLength: 32
      recipient:
        type: string
        maxLength: 32
      text:
        type: string
    type: object
    required:
      - sender
      - recipient
      - text

operations:
  create:
    query: false
    forward: transit
    input:
      properties:
        watchers:
          type: string
          default: .
        sender:
          type: string
          default: .
        recipient:
          type: string
          default: .
        text:
          type: string
          default: .
      type: object
      required:
        - sender
        - recipient
        - text
