# manifest.toa.yaml chronicles declaration, normalised: the events whose renderings are rows of
# the log, the event whose payload is the entity as it stands, and the facts the component sends,
# each with its contract. What a contract's properties are is checked by the extension, which
# says where a property is that has no type of the log.
type: object
properties:
  events:
    type: object
    propertyNames:
      pattern: ^[a-zA-Z][a-zA-Z0-9]*$
    additionalProperties:
      $ref: '#/definitions/contract'
  state:
    type: object
    properties:
      event:
        description: The event whose payload is the entity as it stands
        type: string
        pattern: ^[a-zA-Z][a-zA-Z0-9]*$
      description:
        $ref: '#/definitions/description'
      properties:
        $ref: '#/definitions/properties'
    required: [event, description, properties]
    additionalProperties: false
  facts:
    type: object
    propertyNames:
      pattern: ^[a-zA-Z][a-zA-Z0-9]*(\.[a-zA-Z][a-zA-Z0-9]*)*$
    additionalProperties:
      $ref: '#/definitions/contract'
  identity:
    description: The property of the payloads that names the identity a row is of; null, none
    type: [string, "null"]
    pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
required: [events, facts]
additionalProperties: false
definitions:
  contract:
    type: object
    properties:
      description:
        $ref: '#/definitions/description'
      properties:
        $ref: '#/definitions/properties'
    required: [description, properties]
    additionalProperties: false
  description:
    description: What the label means
    type: string
    minLength: 1
  properties:
    description: What of the payload is written, as JSON Schema
    type: object
