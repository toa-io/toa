# used for development only

name: exposition
registry: localhost

amqp: amqp://localhost
mongodb: mongodb://localhost

configuration:
  identity.tokens:
    keys:
      - id: key0
        key: $IDENTITY_TOKENS_ENCRYPTION_KEY0
      - id: legacy0
        key: $IDENTITY_TOKENS_KEY0
        format: paseto

  identity.federation:
    trust:
      - iss: https://localhost
        aud:
          - one
          - two

storages:
  tmp:
    provider: tmp
    directory: hello

exposition:
  debug: true
