namespace: mongo
name: associated

entity:
  associated: true
  properties:
    foo:
      type: integer
    bar:
      type: string
  blank:
    foo: 0

operations:
  transit:
    concurrency: retry
    input:
      properties:
        foo:
          type: integer
        bar:
          type: string
      type: object
  undelete:
    concurrency: retry
    input:
      properties:
        foo:
          type: integer
        bar:
          type: string
      type: object
  increment:
    concurrency: retry
    input:
      properties:
        foo:
          type: integer
      type: object
