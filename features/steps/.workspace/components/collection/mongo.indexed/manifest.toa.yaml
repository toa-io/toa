namespace: mongo
name: indexed

entity:
  schema:
    name*: string
    email*: string
    birthday: number
    weight: number
    tag: string
  unique:
    email: [email]
    optional: [tag]
  index:
    some:
      birthday: desc
      weight: asc
    some_other:
      name: hash

operations:
  transit:
    concurrency: retry
    input:
      name: string
      email: string
