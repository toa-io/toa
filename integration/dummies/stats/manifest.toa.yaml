namespace: stats
name: stats

entity:
  associated: true
  schema:
    properties:
      messages:
        type: integer
        default: 0
      bankrupt:
        type: boolean
    type: object

operations:
  observe:
    output:
      {}
  update:
    concurrency: retry
    input:
      properties:
        messages:
          type: boolean
        bankrupt:
          type: boolean
      type: object
    output:
      {}

receivers:
  messages.created: update
  credits.balance.updated: update
