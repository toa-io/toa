name: Test

# Every pull request into `dev` reports, so that the check can be required. One that touches
# no source finishes at the first step; the rest is what a merge waits for.
on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the merge commit and both of its parents: the diff against the base parent is
          # exactly what the pull request changes
          fetch-depth: 2

      - name: Find out whether a source changed
        id: changes
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD -- '*.js' '*.ts' package-lock.json .github/workflows/pr.yaml | head -1)

          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no source changed, nothing to test"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci
        env:
          HUSKY: 0

      - name: Check code style
        if: steps.changes.outputs.changed == 'true'
        run: npm run lint

      - name: Check types of the step definitions
        if: steps.changes.outputs.changed == 'true'
        run: npm run typecheck

      - name: Run unit tests
        if: steps.changes.outputs.changed == 'true'
        run: npm run test:unit
