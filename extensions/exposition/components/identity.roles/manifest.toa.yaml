namespace: identity
name: roles

entity:
  schema:
    properties:
      grantor:
        type: string
      identity:
        type: string
        pattern: '[a-z0-9]{32}'
      role:
        type: string
        pattern: ^[a-zA-Z0-9]{0,32}(:[a-zA-Z0-9]{0,32}){0,8}$
    type: object
    required:
      - identity
      - role
  unique:
    role: [identity, role]

operations:
  grant:
    query: false
    input:
      properties:
        grantor:
          properties:
            id:
              type: string
            roles:
              type: array
              items:
                type: string
          type: object
        identity:
          type: string
          default: .
        role:
          type: string
          default: .
      type: object
      required:
        - identity
        - role
    errors:
      - INACCESSIBLE_SCOPE
  list:
    output:
      type: array
      items:
        type: string
  principal:
    input:
      properties:
        id:
          type: string
      type: object

receivers:
  identity.basic.principal: principal
  identity.federation.principal: principal

exposition:
  isolated: true
  /:identity:
    auth:role: system:identity:roles
    POST:
      io:output: [id, grantor]
      auth:rule:
        delegate: grantor
        role: system:identity:roles:delegation
      endpoint: grant
    GET:
      io:output: true # array of strings
      auth:id: identity
      endpoint: list
