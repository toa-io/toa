name: consumer
namespace: external

entity:
  properties:
    time:
      type: integer
    description:
      type: string

operations:
  transit:
    concurrency: none
    input:
      properties:
        time:
          type: string
          default: .
        description:
          type: string
          default: .
      type: object
    query: false

receivers:
  something_happened:
    binding: amqp
    source: external
    operation: transit
