namespace: configuration
name: array

operations:
  greet:
    input: [0, 1]
    output: string

configuration:
  schema:
    type: object
    properties:
      greetings:
        type: array
        items:
          type: object
          properties:
            a: string
            b: string
          required: [a, b]
        default:
          - a: good
            b: day
          - a: good
            b: afternoon
