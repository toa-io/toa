namespace: exposition
name: atom

operations:
  meter:
    bindings: ~ # the gateway calls this in its own process, over the loop
    input:
      type: object
      properties:
        keys:
          type: array
          items:
            type: string
        deltas:
          type: array
          items:
            type: number
      required: [keys, deltas]
      additionalProperties: false
