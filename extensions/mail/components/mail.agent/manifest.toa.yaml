namespace: mail
name: agent

operations:
  send:
    input:
      properties:
        from: { type: string }
        to: { type: string }
        subject: { type: string }
        text: { type: string }
      required: [from, to, subject, text]

configuration:
  schema:
    properties:
      provider:
        type: string
        enum: [Console, Resend]
      domains:
        description: Allowed sender domains
        type: array
        items: { type: string }
      options:
        description: Provider specific options
        type: object
    required: [provider, domains]
