namespace: identity
name: keys

entity:
  schema:
    properties:
      identity:
        type: string
      key:
        type: string
      label:
        type: string
        minLength: 1
        maxLength: 64
      expires:
        type: number
      revokedAt:
        type: integer
    required:
      - identity
      - key
      - label
    type: object
  index:
    identity:
      identity: asc

operations:
  create:
    query: false
    input:
      properties:
        identity:
          type: string
        label:
          type: string
          minLength: 1
          maxLength: 64
        expires:
          type: number
      required:
        - identity
        - label
      type: object
    output:
      properties:
        id:
          type: string
        key:
          type: string
      required:
        - id
        - key
      type: object
  revoke:
    output: { type: 'null' }
    input:
      properties:
        identity:
          type: string
      required:
        - identity
      type: object
  disable:
    concurrency: retry

receivers:
  identity.bans.created: revoke
  identity.bans.updated: revoke
  identity.roles.deleted: revoke

exposition:
  /:identity:
    auth:id: identity
    auth:role: system:identity:keys
    GET:
      io:output: [id, label, expires, revokedAt, _created]
      query:
        sort: _created:desc
      endpoint: enumerate
    /:id:
      DELETE:
        io:output: false
        endpoint: terminate
