name: users

entity:
  properties:
    name: &name
      type: string

operations:
  transit:
    concurrency: retry
    input:
      properties:
        name: *name
      type: object
      required:
        - name
  create:
    concurrency: retry
    query: false
    errors: [0]
    input:
      properties:
        name: *name
      type: object
      required:
        - name
