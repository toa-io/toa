prototype: null

# what its migrations are recorded under, in every collection they are applied to
name: system

entity:
  properties:
    id:
      type: string
      pattern: ^[a-fA-F0-9]{32}$
    VERSION:
      type: integer
      minimum: 0
    CREATED:
      type: integer
      format: epoch-millis
    UPDATED:
      type: integer
      format: epoch-millis
    DELETED:
      type: integer
      format: epoch-millis
      nullable: true
    REGION:
      type: integer
      minimum: 0
  # every one is on a record before it is validated: `id`, `VERSION`, `DELETED` and `REGION`
  # from the blank an entity is composed with, the timestamps from the write that composes it
  required:
    - id
    - VERSION
    - CREATED
    - UPDATED
    - DELETED
    - REGION

operations:
  transit:
    virtual: true
