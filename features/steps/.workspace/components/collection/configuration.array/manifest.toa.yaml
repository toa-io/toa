namespace: configuration
name: array

operations:
  greet:
    input:
      type: number
      enum:
        - 0
        - 1
    output:
      type: string

configuration:
  schema:
    type: object
    properties:
      greetings:
        type: array
        items:
          type: object
          properties:
            a:
              type: string
            b:
              type: string
          required:
            - a
            - b
        default:
          - a: good
            b: day
          - a: good
            b: afternoon
