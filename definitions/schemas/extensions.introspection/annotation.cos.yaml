# context.toa.yaml introspection annotation
properties:
  samples:
    type: boolean
  interval:
    type: integer
    minimum: 1
  threshold:
    type: integer
    minimum: 1
  ui:
    type: boolean
  halt:
    # `true` takes what the runtime holds a halt to; a pair of seconds narrows it
    type: [boolean, object]
    properties:
      duration: &bounds
        type: array
        items:
          type: integer
          minimum: 0
        minItems: 2
        maxItems: 2
      quiescence: *bounds
    additionalProperties: false
  resources:
    # `null` deploys the service without any, which every deployment has to state one way
    # or the other — see `migrations/262.md`.
    type: object
    nullable: true
    properties:
      cpu:
        type: array
        items:
          type: string
        minItems: 2
        maxItems: 2
      memory:
        type: array
        items:
          type: string
        minItems: 2
        maxItems: 2
type: object
