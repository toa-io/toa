name: receiver
namespace: mongo

entity:
  associated: true
  schema:
    properties:
      count:
        type: number
        default: 0
      deleted:
        type: boolean
        default: false
    type: object

operations:
  increment:
    concurrency: retry
  delete:
    concurrency: retry

receivers:
  mongo.one.sync: increment
  mongo.one.deleted: delete
