name: converging
namespace: mongo

entity:
  storage: mongodb
  properties:
    foo: &foo
      type: integer
  blank:
    foo: 0

operations:
  transit:
    concurrency: retry
    input:
      properties:
        foo: *foo
      type: object

  # the same call arriving twice changes state once, on a storage convergence decorates
  record:
    concurrency: retry
    once: true
    input:
      properties:
        foo: *foo
      type: object

  # the same, through a changeset
  assign:
    once: true
    input:
      properties:
        foo: *foo
      type: object
