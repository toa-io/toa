name: one
namespace: mongo

entity:
  storage: mongodb
  properties:
    foo: &foo
      type: integer
    bar: &bar
      type: string
    baz: &baz
      type: boolean
    due: &due
      type: integer
      format: epoch-millis
  blank:
    foo: 0

operations:
  transit:
    concurrency: retry
    input:
      properties:
        foo: *foo
        bar: *bar
        baz: *baz
      type: object
  assign:
    input:
      properties:
        foo: *foo
        bar: *bar
        baz: *baz
        due: *due
      type: object
  nothing:
    concurrency: retry
