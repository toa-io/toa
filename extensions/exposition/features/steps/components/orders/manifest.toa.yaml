name: orders

entity:
  schema:
    properties:
      title:
        type: string
      volume:
        type: number
      price:
        type: number
    type: object
    required:
      - title
      - volume

operations:
  create:
    concurrency: retry
    query: false
    input:
      properties:
        title:
          type: string
          default: .
        volume:
          type: string
          default: .
      type: object
      required:
        - title
        - volume
