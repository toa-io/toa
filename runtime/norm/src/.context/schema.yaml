$schema: https://json-schema.org/draft/2019-09/schema
$id: https://schemas.toa.io/0.0.0/context

type: object
properties:
  version:
    type: string
  name:
    type: string
    pattern: ^([a-zA-Z]+([_a-zA-Z0-9]*[a-zA-Z0-9]+)?)(-([a-zA-Z]+([_a-zA-Z0-9]*[a-zA-Z0-9]+)?))*$
  description:
    type: string
  build:
    type: object
    properties:
      command:
        type: string
  runtime:
    type: object
    properties:
      version:
        type: string
      registry:
        type: string
        format: uri
      proxy:
        type: string
        format: uri
    required: [version]
  environment:
    type: string
  registry:
    type: object
    properties:
      base:
        type: string
      platforms:
        type: array
        nullable: true
        minItems: 1
        items:
          type: string
        default:
          - linux/amd64
          - linux/arm/v7
          - linux/arm64
    # required: [base]
  compositions:
    type: array
    minItems: 1
    items:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-zA-Z]([a-zA-Z0-9]{1,31})?$
        image:
          type: string
        components:
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^([a-zA-Z]+([_a-zA-Z0-9]*[a-zA-Z0-9]+)?)(\.([a-zA-Z]+([_a-zA-Z0-9]*[a-zA-Z0-9]+)?))$
        resources:
          $ref: '#/definitions/resources'
      required: [name, components]
  outbox:
    type: object
    additionalProperties: false
    properties:
      redis:
        description: >
          Coordination for the outbox sweep. System infrastructure rather than a per-component
          resource: it holds nothing but interval counters, one small key per component. Absent,
          every replica sweeps every lane, which is correct and only publishes a stranded row
          more than once.
        oneOf:
          - type: string
          - type: array
            minItems: 1
            items:
              type: string
      interval:
        description: >
          The cycle, in milliseconds. One cycle marks what was published, then sweeps what was
          not. In steady state the sweep finds nothing, so this is budgeted for how fast a rare
          failure heals rather than for how fast events flow.
        type: integer
        minimum: 100
      retention:
        description: >
          Seconds a published row is kept as a change log before it expires. A row that never
          made it out has no expiry and is never reaped.
        type: integer
        minimum: 0
  mono:
    type: object
    additionalProperties: false
    properties:
      replicas:
        type: integer
        minimum: 1
      resources:
        $ref: '#/definitions/resources'
  ingress:
    type: object
    additionalProperties: false
    properties:
      hosts:
        type: array
        minItems: 1
        items:
          type: string
      class:
        type: string
      annotations:
        type: object
      default:
        type: boolean
  annotations:
    type: object
  resources:
    $ref: '#/definitions/resources'
required: [runtime, name, registry]
additionalProperties: false

definitions:
  # What a deployment may take. `null` deploys it without any, which is a decision
  # rather than an omission — every deployment has to make one.
  resources:
    type: object
    nullable: true
    additionalProperties: false
    properties:
      cpu:
        type: array
        items:
          type: string
        minItems: 2
        maxItems: 2
      memory:
        type: array
        items:
          type: string
        minItems: 2
        maxItems: 2
