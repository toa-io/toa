namespace: identity
name: basic

entity:
  associated: true
  schema:
    properties:
      authority:
        type: string
      username:
        type: string
      password:
        type: string
    type: object
    required:
      - authority
      - username
      - password
  unique:
    authority_username: [authority, username]
  index:
    username:
      authority: asc
      username: asc

operations:
  transit:
    concurrency: retry
    input:
      properties:
        username:
          type: string
        password:
          type: string
        authority:
          type: string
      type: object
    errors: &transit.errors
      - PRINCIPAL_LOCKED
      - INVALID_USERNAME
      - INVALID_PASSWORD
      - EXISTS
  create:
    forward: transit
    query: false
    input:
      properties:
        authority:
          type: string
        username:
          type: string
        password:
          type: string
      type: object
      required:
        - authority
        - username
        - password
    errors: *transit.errors
  add:
    input:
      properties:
        id:
          type: string
        authority:
          type: string
        username:
          type: string
        password:
          type: string
      type: object
      required:
        - id
        - authority
        - username
        - password
    errors: *transit.errors
  incept:
    input:
      properties:
        authority:
          type: string
        id:
          type: string
        credentials:
          type: string
      type: object
      required:
        - authority
        - id
        - credentials
    output:
      properties:
        id:
          type: string
      type: object
    errors:
      - INVALID_CREDENTIALS
  authenticate:
    input:
      properties:
        authority:
          type: string
        credentials:
          type: string
      type: object
      required:
        - authority
        - credentials
    output:
      properties:
        identity:
          properties:
            id:
              type: string
          type: object
      type: object
    errors:
      - NOT_FOUND
      - PASSWORD_MISMATCH
  check:
    input:
      type: object
      properties:
        username:
          type: string
          minLength: 1
      required:
        - username
    output:
      {}
  info:
    input:
      properties:
        authority:
          type: string
        identity:
          type: string
      type: object
      required:
        - authority
        - identity
    output:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        username:
          type: string
      required:
        - username
  delete:
    input:
      properties:
        authority:
          type: string
        identity:
          type: string
      type: object
      required:
        - authority
        - identity

configuration:
  schema:
    type: object
    properties:
      rounds:
        type: integer
        default: 10
      pepper:
        type: string
        default: ''
      principal:
        type: string
      username:
        type: array
        items:
          type: string
        default:
          - ^.{1,128}$
      password:
        type: array
        items:
          type: string
        default:
          - ^.{8,32}$

exposition:
  isolated: true
  /:
    POST:
      anonymous: true
      map:authority: authority
      io:output: [id]
      endpoint: create
  /:id:
    io:output: [id]
    io:input: [username, password]
    auth:role: system:identity:basic
    auth:id: id
    PATCH:
      auth:scheme: basic
      endpoint: transit
    POST:
      map:authority: authority
      map:segments:
        id: id
      endpoint: add
    DELETE:
      map:authority: authority
      map:segments:
        identity: id
      io:output: false
      endpoint: delete

  /usernames/:username:
    GET:
      map:authority: authority
      anonymous: true
      endpoint: check
