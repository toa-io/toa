namespace: identity
name: otp

entity:
  schema:
    definitions:
      id: &id
        type: string
        pattern: ^[0-9a-f]{32}$
    type: object
    properties: &properties
      authority: { type: string }
      username: { type: string }
    required: [authority, username]
  index:
    username:
      authority: asc
      username: asc

operations:
  issue:
    input:
      properties:
        <<: *properties
        identity: *id
        lifetime: &lifetime
          type: number
          minimum: 1
          maximum: 36000 # 10 hours
      required: [authority, username]
  authenticate:
    input:
      properties:
        authority: { type: string }
        credentials: { type: string }
      required: [authority, credentials]
    output:
      properties:
        identity:
          properties:
            id: { type: string }
    errors:
      - INVALID_CREDENTIALS
      - EXPIRED
      - NOT_FOUND

configuration:
  schema:
    properties:
      lifetime:
        <<: *lifetime
        default: 300

stash: ~
