namespace: credits
name: balance

entity:
  schema:
    properties:
      balance:
        type: integer
        default: 10
    type: object
  associated: true

operations:
  transit:
    concurrency: none
    input:
      properties:
        balance:
          type: string
          default: .
      type: object
  deduce:
    concurrency: none
    input:
      type: integer
    output:
      type: integer
    query: true
  debit:
    concurrency: retry
    input:
      type: integer
    output:
      type: integer
    query: true
  transfer:
    concurrency: none
    input:
      type: string
      default: id
    output:
      type: integer
    query: true # target balance
  nullify:
    concurrency: retry
    output:
      type: integer
  set:
    input:
      properties:
        balance:
          type: string
          default: .
      type: object
    forward: assign
  add:
    input:
      properties:
        balance:
          type: string
          default: .
      type: object
    query: false
    forward: transit

extensions:
  '@toa.io/extensions.exposition':
    /:
      POST: add
    /:id:
      GET: observe
      PUT: set
