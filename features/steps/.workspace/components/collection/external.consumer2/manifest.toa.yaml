name: consumer2
namespace: external

entity:
  properties:
    time: &time
      type: integer
    description: &description
      type: string

operations:
  transit:
    concurrency: none
    input:
      properties:
        time: *time
        description: *description
      type: object
    query: false

receivers:
  something_happened:
    binding: amqp
    source: external
    operation: transit
