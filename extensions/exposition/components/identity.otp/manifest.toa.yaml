namespace: identity
name: otp

entity:
  schema:
    definitions:
      id: &id
        type: string
        pattern: ^[0-9a-f]{32}$
    type: object
    properties: &properties
      authority: { type: string }
      username: { type: string, minLength: 1, maxLength: 256 }
      identity: *id
    required: [authority, username]
  index:
    username:
      authority: asc
      username: asc

operations:
  issue:
    input:
      properties:
        <<: *properties
        identity: *id
        lifetime: &lifetime
          description: OTP expiration time in seconds
          type: number
          minimum: 1
          maximum: 3600
      required: [authority, username]
  authenticate:
    input:
      properties:
        authority: { type: string }
        credentials: { type: string }
      required: [authority, credentials]
    output:
      properties:
        identity:
          properties:
            id: { type: string }
    errors:
      - INVALID_CREDENTIALS
      - EXPIRED
      - NOT_FOUND

configuration:
  schema:
    properties:
      lifetime:
        description: OTP expiration time in seconds
        <<: *lifetime
        default: 300

stash: ~

exposition:
  /:identity:
    auth:id: identity
    auth:role: system:identity:otp
    POST:
      io:input: []
      io:output: [code]
      map:authority: authority
      map:segments:
        username: identity
      endpoint: issue
