prototype: null

# what its migrations are recorded under, in every collection they are applied to
name: system

entity:
  properties:
    id:
      type: string
      pattern: ^[a-fA-F0-9]{32}$
    VERSION:
      type: integer
      minimum: 0
    CREATED:
      type: integer
      format: epoch-millis
    UPDATED:
      type: integer
      format: epoch-millis
    DELETED:
      type: integer
      format: epoch-millis
      nullable: true
    REGION:
      type: integer
      minimum: 0
  required:
    - id

operations:
  transit:
    virtual: true
