namespace: mail
name: agent

operations:
  send:
    input:
      properties:
        to: { type: string }
        subject: { type: string }
        text: { type: string }
        template: { type: string }
        data: { type: object, default: { } }
      required: [to]
      oneOf:
        - required: [subject, text]
        - required: [template]

configuration:
  schema:
    properties:
      provider: { type: string, enum: [Console, Resend] }
      from: { type: string, format: email }
      templates: { type: string, format: uri }
      options: { type: object }
    required: [provider, from]
