properties:
  class:
    type: string
  resources:
    # `null` deploys the service without any, which every deployment has to state one way
    # or the other — see `migrations/263.md`.
    type: object
    nullable: true
    properties:
      cpu:
        type: array
        items:
          type: string
        minItems: 2
        maxItems: 2
      memory:
        type: array
        items:
          type: string
        minItems: 2
        maxItems: 2
  annotations:
    type: object
    patternProperties:
      ^.+$:
        type: string
  service:
    type: object
    properties:
      annotations:
        type: object
        patternProperties:
          ^.+$:
            type: string
  debug:
    type: boolean
  ip:
    type: string
    minLength: 1
  bouncer:
    type: object
    properties:
      attempts:
        type: integer
        minimum: 1
      interval:
        type: integer
        minimum: 1
    additionalProperties: false
  protocol:
    type: string
    enum: [h1, h2c]
  oauth:
    type: object
    properties:
      authorize:
        description: The absolute URL of the consent page the application serves
        type: string
        pattern: ^https?://
      resources:
        description: Paths a token may be restricted to
        type: array
        items:
          type: string
          pattern: ^/
      scopes:
        type: array
        items:
          type: string
      trust:
        description: Origins whose Client ID Metadata Documents may be read
        type: array
        items:
          type: string
          pattern: ^https://
      registration:
        type: string
        enum: [open, closed]
        default: closed
    required:
      - authorize
    additionalProperties: false
  rpc:
    description: JSON-RPC at `/.rpc`; writing it is what turns the endpoint on
    type: object
    properties:
      batch:
        description: Calls one request may carry
        type: integer
        minimum: 1
    additionalProperties: false
  mcp:
    description: MCP at `/.mcp`; writing it is what turns the endpoint on
    type: object
    properties:
      name:
        description: What the server calls itself
        type: string
        minLength: 1
      instructions:
        description: What a model is told before it calls anything here
        type: string
      origins:
        description: Browser origins the endpoint answers; none without it
        type: array
        items:
          type: string
          pattern: ^https?://
      anonymous:
        description: Whether the endpoint answers without a credential
        type: boolean
        default: false
    required:
      - name
    additionalProperties: false
  /: {}
  authorities:
    type: object
    patternProperties:
      ^.+$:
        type: string
type: object
required:
  - authorities
dependencies:
  bouncer:
    - ip
