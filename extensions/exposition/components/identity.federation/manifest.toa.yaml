namespace: identity
name: federation

entity:
  schema:
    type: object
    properties:
      authority:
        description: The authority token is valid for
        type: string
      iss:
        description: The issuer, or signer, of the token, URI like `https://accounts.google.com`
        type: string
      sub:
        description: The ID that represents the principal making the request
        type: string
      identity:
        description: Identity associated with these credentials
        type: string
    required:
      - authority
      - iss
      - sub
      - identity
    additionalProperties: false
  unique:
    token: [authority, iss, sub]
    identity: [authority, iss, identity]
  index:
    list:
      authority: asc
      identity: asc
      _created: desc

operations:
  transit:
    concurrency: retry
    input:
      properties:
        authority:
          type: string
        iss:
          type: string
        sub:
          type: string
        identity:
          type: string
      type: object
      required:
        - authority
        - iss
        - sub
        - identity
  create:
    input:
      properties:
        scheme:
          type: string
          enum:
            - bearer
            - code
        authority:
          type: string
        credentials:
          type: string
        id:
          type: string
      type: object
      required:
        - scheme
        - authority
        - credentials
        - id
    errors:
      - EXISTS
  incept:
    input:
      properties:
        scheme:
          type: string
          enum:
            - bearer
            - code
        authority:
          type: string
        credentials:
          type: string
        id:
          type: string
      type: object
      required:
        - scheme
        - authority
        - credentials
        - id
    output:
      properties:
        id:
          type: string
      type: object
    errors:
      - EXISTS
  authenticate:
    input:
      properties:
        scheme:
          type: string
          enum:
            - bearer
            - code
        authority:
          type: string
        credentials:
          type: string
      type: object
      required:
        - scheme
        - authority
        - credentials
    output:
      properties:
        identity:
          properties:
            id:
              type: string
            claims:
              properties:
                iss:
                  type: string
                aud:
                  type: string
                sub:
                  type: string
              additionalProperties: true
              required:
                - iss
                - sub
              type: object
          required:
            - id
            - claims
          type: object
      type: object
    errors:
      - ERR_NOT_FOUND
      - TOKEN
  decode:
    input:
      type: string
    output:
      properties:
        iss:
          type: string
        aud:
          type: string
        sub:
          type: string
      additionalProperties: true
      required:
        - iss
        - sub
      type: object
  list:
    input:
      properties:
        authority:
          type: string
        identity:
          type: string
      type: object
      required:
        - authority
        - identity
  delete:
    input:
      properties:
        authority:
          type: string
        identity:
          type: string
        credential:
          type: string
      type: object
      required:
        - authority
        - identity
        - credential

configuration:
  schema:
    type: object
    properties:
      trust:
        type: array
        items:
          title: Trusted Identity Providers
          type: object
          additionalProperties: false
          properties:
            iss:
              description: Allowed values for a token `iss` field
              type: string
              format: uri
            aud:
              description: Acceptable `aud` value(s)
              anyOf:
                - type: string
                - type: array
                  items:
                    type: string
                  uniqueItems: true
                  minItems: 1
            signature:
              properties:
                iss:
                  type: string
                kid:
                  type: string
                key:
                  description: PKCS8 private key in PEM form
                  type: string
              required:
                - iss
                - kid
                - key
            secret:
              description: Client secret for the Identity Provider. Required for Authorization Code Flow.
              type: string
          required:
            - iss
            - aud
        default: []
      principal:
        title: Principal
        description: Subject that will be assigned the `system` Role
        type: object
        properties:
          authority:
            type: string
          iss:
            type: string
            format: uri
          sub:
            type: string
        required:
          - authority
          - iss
          - sub
        additionalProperties: false
      assert:
        title: Implicitly incept Identity for new credentials
        type: boolean
        default: true
    additionalProperties: false

exposition:
  /:
    /:id:
      auth:id: id
      POST:
        map:authority: authority
        io:input: [scheme, credentials]
        io:output: &credential [id, iss, _created]
        endpoint: create
      GET:
        map:authority: authority
        map:segments:
          identity: id
        io:output: *credential
        endpoint: list
      /:credential:
        DELETE:
          map:authority: authority
          map:segments:
            identity: id
            credential: credential
          io:output: false
          endpoint: delete
