namespace: realtime
name: streams

operations:
  create:
    input:
      key: string
      token: string
  push:
    bindings: ~ # only for internal use
    input:
      key*: string
      event*: string
      data: ~

configuration:
  schema:
    properties:
      maxlen:
        type: number
        default: 1000
      expire:
        type: number
        default: 300

state: ~
stash: ~

exposition:
  /:key:
    auth:id: key
    GET: create
