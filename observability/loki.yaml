# Toa's local logs backend, what `telemetry.logs.exporters.otlp` posts to in development.
# OTLP arrives at /otlp/v1/logs; resource attributes Loki indexes become stream labels
# (`service.name` -> `service_name`), the rest and every record attribute become structured
# metadata, which the tsdb v13 schema below is what makes legal.
#
# https://github.com/grafana/loki/blob/v3.0.0/cmd/loki/loki-local-config.yaml
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 500

limits_config:
  allow_structured_metadata: true
  query_timeout: 5m
  split_queries_by_interval: 15m

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
