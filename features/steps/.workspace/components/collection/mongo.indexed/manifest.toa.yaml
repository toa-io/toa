namespace: mongo
name: indexed

entity:
  schema:
    properties:
      birthday:
        type: number
      weight:
        type: number
      tag:
        type: string
      name:
        type: string
      email:
        type: string
    type: object
    required:
      - name
      - email
  unique:
    email: [email]
    optional: [tag]
  index:
    some:
      birthday: desc
      weight: asc
    some_other:
      name: hash

operations:
  transit:
    concurrency: retry
    input:
      properties:
        name:
          type: string
        email:
          type: string
      type: object
