namespace: mongo
name: entries

entity:
  associated: true
  properties:
    count:
      type: integer
  blank:
    count: 0

operations:
  # adds one to every entry of its set, and where it is told to, has one of them touched by
  # another call after it has read the set and before it commits it, and flags the ones it names
  # as discarded
  bump:
    concurrency: none
    input:
      type: object
      properties:
        touch:
          type: string
        discard:
          type: array
          items:
            type: string
  # adds ten to one entry, or creates it with ten
  touch:
    concurrency: none
    input:
      type: object
  # adds one to an entry, and commits none of it
  skip:
    concurrency: none
