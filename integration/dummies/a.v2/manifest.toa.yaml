namespace: dummies
name: a

entity:
  schema:
    properties:
      title:
        type: string
      length:
        type: integer
    required:
      - title
    type: object
  associated: true

operations:
  create:
    forward: transit
    query: false
    input:
      properties:
        title:
          type: string
          default: .
        length:
          type: string
          default: .
      type: object

extensions:
  exposition:
    /:id:
      GET: observe
    /v2/:id:
      GET: observe
