prototype: null

entity:
  properties:
    id:
      type: string
      pattern: ^[a-fA-F0-9]{32}$
    VERSION:
      type: integer
      minimum: 0
    CREATED:
      type: integer
    UPDATED:
      type: integer
    DELETED:
      type: integer
      nullable: true
  required:
    - id

operations:
  transit:
    virtual: true
