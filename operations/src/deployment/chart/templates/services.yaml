{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: extension-{{ required "deployment name is required" .name }}
spec:
  replicas: {{ .replicas | default 2 }}
  # A backstop for stuck rollouts only. Must stay above the `helm upgrade --timeout`
  # the deploy runs with, so a slow but progressing rollout is not marked failed.
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 50%
  selector:
    matchLabels:
      toa.io/service: extension-{{ .name }}
  template:
    metadata:
      labels:
        toa.io/service: extension-{{ .name }}
    spec:
      containers:
        - name: extension-{{ .name }}
          image: {{ .image }}
          {{- if .resources }}
          resources:
            {{- if or .resources.cpu .resources.memory }}
            requests:
              {{- if .resources.cpu }}
              cpu: {{ index .resources.cpu 0 }}
              {{- end }}
              {{- if .resources.memory }}
              memory: {{ index .resources.memory 0 }}
              {{- end }}
            limits:
              {{- if .resources.cpu }}
              cpu: {{ index .resources.cpu 1 }}
              {{- end }}
              {{- if .resources.memory }}
              memory: {{ index .resources.memory 1 }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if .variables }}
          env:
            {{- range .variables }}
            {{- include "env.var" . | indent 12 }}
            {{- end }}
          {{- end }}
          {{- if .probe }}
          startupProbe:
            httpGet:
              path: {{ .probe.path }}
              port: {{ .probe.port }}
            {{- if .probe.delay }}
            initialDelaySeconds: {{ .probe.delay }}
            {{- end }}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 150
          readinessProbe:
            httpGet:
              path: {{ .probe.path }}
              port: {{ .probe.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: [sleep, "5"]
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              toa.io/service: extension-{{ .name }}
{{- if .port }}
---
apiVersion: v1
kind: Service
metadata:
  name: extension-{{ .name }}
spec:
  type: ClusterIP
  selector:
    toa.io/service: extension-{{ .name }}
  ports:
    - name: port-{{ .port }}
      protocol: TCP
      port: {{ .port }}
      targetPort: {{ .port }}
{{- end }}
{{- if .ingress }}
{{- $service := .name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: extension-{{ .name }}
  {{- if .ingress.annotations }}
  annotations:
{{ toYaml .ingress.annotations | indent 4 }}
  {{- end }}
spec:
  {{- if .ingress.class }}
  ingressClassName: {{ .ingress.class }}
  {{- end }}
  rules:
    {{- range .ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: extension-{{ $service }}
                port:
                  number: 8000
    {{- end }}
    {{- if .ingress.default }}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: extension-{{ $service }}
                port:
                  number: 8000
    {{- end }}
{{- end }}
---
{{- end }}
