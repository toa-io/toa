name: consumer2
namespace: external

entity:
  storage: sql
  schema:
    properties:
      time:
        type: integer
      description:
        type: string
    type: object

operations:
  transit:
    concurrency: none
    input:
      properties:
        time:
          type: string
          default: .
        description:
          type: string
          default: .
      type: object
    query: false

receivers:
  something_happened:
    binding: amqp
    source: external
    operation: transit
