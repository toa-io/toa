name: caller
namespace: mongo

entity:
  storage: mongodb
  properties:
    foo:
      type: integer
  blank:
    foo: 0

operations:
  # calls `mongo.once` on its way, so that a duplicate of this call is a duplicate of that one
  # not retried: a transition that is does not call what declares `once`
  relay: &relay
    scope: entry
    concurrency: none
    once: true
    input:
      properties:
        foo:
          type: integer
        target:
          type: string
      type: object
  # the same call, made by a transition that is retried
  retried:
    <<: *relay
    concurrency: retry
  # a retried transition calling what declares nothing
  plain:
    <<: *relay
    concurrency: retry
