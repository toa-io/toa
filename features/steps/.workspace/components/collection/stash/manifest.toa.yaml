name: stash

operations:
  set:
    input:
      type: string
  get:
    output:
      type: string
  inc:
    input:
      type: string
    output:
      type: number
  del:
    input:
      type: string
  store:
    input:
      oneOf:
        - type: object
        - type: array
  fetch:
    output:
      oneOf:
        - type: object
        - type: array
stash: ~
