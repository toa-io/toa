# Toa's own development stack.
#
# It shares a machine with the applications built on Toa, and every one of those carries the
# same compose file — on the conventional ports. So nothing here publishes one of those: the
# whole stack sits in a block of its own, `31000-31099`, and the table that names each port is in
# CONTRIBUTING.md. A container keeps its own port where it can; MongoDB and LocalStack
# advertise the address they are reached at, so those two listen on the published port.
#
# The block is below the ephemeral range (`net.ipv4.ip_local_port_range`, 32768 by default),
# so an outgoing connection can never be holding a port when the stack comes up.
name: toa
services:
  rabbitmq:
    image: rabbitmq:3.10.0-management
    ports:
      - "31010:5672"
      - "31011:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    environment:
      RABBITMQ_DEFAULT_USER: developer
      RABBITMQ_DEFAULT_PASS: secret
  mongodb:
    image: mongo:8.0.16
    # a bind mount carries the host's ownership, and the keyfile `setup:mongo` writes belongs
    # to the developer, not to `mongodb` — mongod, which drops to that user, then reads
    # nothing and exits. The entrypoint copies it in with the owner and the mode mongod
    # demands, so the host file needs no ownership of its own.
    entrypoint:
      - bash
      - -c
      - install -m 400 -o mongodb -g mongodb /etc/mongo-keyfile/keyfile /tmp/keyfile
        && exec docker-entrypoint.sh "$@"
      - --
    # the port is the published one, not 27017: a replica set advertises the address its
    # members are reachable at, and a client that connects to a published port is then told
    # to reconnect to whatever `rs.initiate` recorded. Only a port that means the same inside
    # the container and out of it survives that round trip.
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--keyFile",
        "/tmp/keyfile",
        "--port",
        "31020",
      ]
    ports:
      - "31020:31020"
    environment:
      MONGO_INITDB_ROOT_USERNAME: developer
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - ./.mongo-keyfile:/etc/mongo-keyfile/keyfile:ro
    healthcheck:
      test: >
        bash -lc 'mongosh "mongodb://developer:secret@localhost:31020/admin?directConnection=true" --quiet
        --eval "try{rs.status().ok}catch(e){rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:31020\"}]});} ; db.runCommand({ping:1}).ok" | grep 1'
      interval: 5s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:14.4
    ports: ["31030:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d integration -U developer"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: integration
  redis0:
    image: redis:7.0.11
    ports:
      - "31040:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
  redis1:
    image: redis:7.0.11
    ports:
      - "31041:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
  redis2:
    image: redis:7.0.11
    ports:
      - "31042:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
  localstack:
    # pinned: from the calendar-versioned releases on, the image asks for a license and quits
    # with exit code 55 when `LOCALSTACK_AUTH_TOKEN` is unset, so an untagged pull leaves the
    # S3 the storages suite writes to unstarted
    image: localstack/localstack:4.9
    ports:
      - "127.0.0.1:31050:31050"
    environment:
      - DEBUG=1
      # the gateway is reached at the published port from both sides: `awslocal`,
      # which the ready hook and the healthcheck run inside the container, addresses
      # it by `LOCALSTACK_HOST`, and so does the URL S3 answers with
      - GATEWAY_LISTEN=0.0.0.0:31050
      - LOCALSTACK_HOST=localhost.localstack.cloud:31050
      - SERVICES=s3
      - ALLOW_NONSTANDARD_REGIONS=1
      - AWS_ACCESS_KEY_ID=developer
      - AWS_SECRET_ACCESS_KEY=secret
      - AWS_DEFAULT_REGION=us-west-1
    healthcheck:
      test:
        [
          "CMD",
          "awslocal",
          "s3api",
          "wait",
          "bucket-exists",
          "--bucket",
          "test-bucket",
        ]
    volumes:
      - "./localstack/init.sh:/etc/localstack/init/ready.d/init-aws.sh" # ready hook
      - "/var/run/docker.sock:/var/run/docker.sock"
  tempo:
    image: grafana/tempo:3.0.2
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "31060:3200" # Tempo API
      - "31061:4318" # OTLP/HTTP
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports:
      - "31070:9090"
  grafana:
    image: grafana/grafana:13.1.3
    ports:
      - "31080:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
