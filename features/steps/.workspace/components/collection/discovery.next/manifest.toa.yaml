# `discovery.peer` after a change. Its locator is the same and its version is not: one more
# operation, and `appeared`, which the version before it does not declare.
name: peer
namespace: discovery

entity:
  storage: ~
  properties:
    foo:
      type: integer
  blank:
    foo: 0

operations:
  serves:
    type: computation
  added:
    type: computation
