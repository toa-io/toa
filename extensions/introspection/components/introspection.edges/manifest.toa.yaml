namespace: introspection
name: edges

# One document per edge of the map: a call one component made to another, with `src`
# saying what caused it — another operation, an event, or a service. What the
# application declares is described by `introspection.nodes`; an edge is what
# actually happened.
#
# Every replica of a component derives the same id for the same edge, so `merge` is
# an upsert and `_updated` shows when the edge was last observed.

entity:
  associated: true
  schema:
    properties: &observed
      src:
        description: What caused the call — another operation, an event, or a service
        type: object
        properties:
          namespace: { type: string }
          component: { type: string }
          operation: { type: string }
          event: { type: string }
          service: { type: string }
      dst:
        description: What was called
        type: object
        required: [namespace, component, operation]
        properties:
          namespace: { type: string }
          component: { type: string }
          operation: { type: string }
      sample:
        description: The last call observed on this edge
        type: object
        required: [at, outcome]
        properties:
          at: { type: integer }
          input: {}
          outcome: { type: string }
    required: [src, dst]
    type: object

operations:
  # a mass transition: the scope is inferred from the algorithm's `objects` parameter
  merge:
    concurrency: retry
    input:
      type: object
      properties:
        edges:
          description: What each replica observed since its last flush, by edge id
          type: object
          additionalProperties:
            type: object
            properties: *observed
            required: [src, dst]
      required:
        - edges

# the map must not describe itself
introspection: false

exposition:
  isolated: true
  /:
    auth:role: system:introspection

    # the map is the whole document, and its shape is what the application happens to declare
    io:output: true
    cache:control: max-age=60, public
    # the map is read whole: a page of ten is of no use to anything that draws it
    GET:
      endpoint: enumerate
      query:
        limit:
          value: 10000
          range: [1, 10000]
    /:id:
      GET: observe
