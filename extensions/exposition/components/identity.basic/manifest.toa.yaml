namespace: identity
name: basic

entity:
  associated: true
  schema:
    authority*: string
    username*: string
    password*: string
  unique:
    authority_username: [authority, username]
  index:
    username:
      authority: asc
      username: asc

operations:
  transit:
    concurrency: retry
    input:
      username: string
      password: string
      authority: string
    errors: &transit.errors
      - PRINCIPAL_LOCKED
      - INVALID_USERNAME
      - INVALID_PASSWORD
      - EXISTS
  create:
    forward: transit
    query: false
    input:
      authority*: string
      username*: string
      password*: string
    errors: *transit.errors
  add:
    input:
      authority*: string
      username*: string
      password*: string
    errors: *transit.errors
  incept:
    input:
      authority*: string
      id*: string
      credentials*: string
    output:
      id: string
    errors:
      - INVALID_CREDENTIALS
  authenticate:
    input:
      authority*: string
      credentials*: string
    output:
      identity:
        id: string
    errors:
      - NOT_FOUND
      - PASSWORD_MISMATCH
  check:
    input:
      type: object
      properties:
        username:
          type: string
          minLength: 1
      required:
        - username
    output: null

configuration:
  rounds: 10
  pepper: ""
  principal: string
  username+: ^.{1,128}$
  password+: ^.{8,32}$

exposition:
  isolated: true
  /:
    POST:
      anonymous: true
      map:authority: authority
      io:output: [id]
      endpoint: create
  /:id:
    io:output: [id]
    io:input: [username, password]
    auth:role: system:identity:basic
    auth:id: id
    PATCH:
      auth:scheme: basic
      endpoint: transit
    POST:
      map:authority: authority
      map:segments:
        id: id
      endpoint: add

  /usernames/:username:
    GET:
      map:authority: authority
      anonymous: true
      endpoint: check
