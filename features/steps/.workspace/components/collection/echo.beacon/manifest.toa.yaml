name: beacon
namespace: echo

operations:
  echo:
    input:
      type: string
    output:
      type: string
  reflect:
    input:
      properties:
        id:
          type: string
      additionalProperties: true
      type: object
    output:
      type: object
  print:
    input:
      type: string
    output:
      type: string
  def:
    forward: echo
    input:
      type: string
      default: ok
    output:
      type: string
  throw:
    input:
      type: string
    output:
      {}
