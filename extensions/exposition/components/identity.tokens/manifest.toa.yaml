namespace: identity
name: tokens

entity:
  associated: true
  properties:
    revokedAt:
      type: integer

operations:
  encrypt:
    input:
      properties:
        lifetime:
          type: number
          minimum: 0
        scopes:
          type: array
          items:
            type: string
        permissions:
          type: object
          patternProperties:
            ^.*$:
              type: array
              items:
                type: string
        audience:
          description: Resource URIs this token may be presented at (RFC 8707)
          type: array
          items:
            type: string
        key:
          type: object
          properties:
            id:
              type: string
            key:
              type: string
          required:
            - id
            - key
        authority:
          type: string
        identity:
          required: [id, roles]
          properties:
            id:
              type: string
            roles:
              type: array
              items:
                type: string
          additionalProperties: true
          type: object
      type: object
      required:
        - authority
        - identity
    output:
      type: string
    errors:
      - INACCESSIBLE_SCOPE
  decrypt:
    input:
      type: string
    output:
      required: [iss, iat, identity, refresh, custom]
      properties:
        iss:
          description: The authority the token names as its issuer
          type: string
        identity:
          required: [id, roles]
          properties:
            id:
              type: string
            roles:
              type: array
              items:
                type: string
          additionalProperties: true
          type: object
        iat:
          type: string
        exp:
          type: string
        aud:
          description: Resource URIs this token may be presented at
          type: [string, array]
        custom:
          type: boolean
        refresh:
          type: boolean
      type: object
    errors:
      - INVALID_TOKEN
      - INVALID_KEY
      - FORGED_KEY
      - REVOKED_KEY
  authenticate:
    input:
      properties:
        authority:
          type: string
        credentials:
          type: string
      type: object
      required:
        - authority
        - credentials
    output:
      required: [identity, refresh]
      properties:
        identity:
          required: [id, roles]
          properties:
            id:
              type: string
            roles:
              type: array
              items:
                type: string
          additionalProperties: true
          type: object
        refresh:
          type: boolean
      type: object
    errors:
      - UNRECOGNIZED
      - AUTHORITY_MISMATCH
      - TOKEN_REVOKED
      # what `decrypt` refuses with, passed on
      - INVALID_TOKEN
      - INVALID_KEY
      - FORGED_KEY
      - REVOKED_KEY
  issue:
    input:
      type: object
      properties:
        authority:
          type: string
        identity:
          type: string
        lifetime:
          type: number
          minimum: 0
        scopes:
          type: array
          items:
            type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        audience:
          description: Resource URIs this token may be presented at (RFC 8707)
          type: array
          items:
            type: string
        label:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - authority
        - identity
        - label
    output:
      required: [kid, token]
      properties:
        kid:
          type: string
        exp:
          type: number
        token:
          type: string
      type: object
    errors:
      - INACCESSIBLE_SCOPE
  revoke:
    output: { type: 'null' }
    concurrency: retry

receivers:
  identity.bans.created: revoke
  identity.bans.updated: revoke

configuration:
  schema:
    type: object
    properties:
      keys:
        type: array
        minItems: 1
        # at least one key issues, which a `paseto` one does not
        contains:
          not:
            properties:
              format:
                const: paseto
            required: [format]
        items:
          type: object
          properties:
            id:
              type: string
              minLength: 1
            key:
              type: string
              format: secret
            format:
              # a key that does not say is a JWE, which is what the component reads it as
              type: string
              enum:
                - jwe
                - paseto
          required:
            - id
            - key
          additionalProperties: false
      lifetime:
        description: Token expiration time in seconds (default 30 days)
        type: integer
      refresh:
        description: Token refresh time in seconds (default 10 minutes)
        type: integer
      cache:
        description: Custom token keys LRU cache configuration
        properties:
          max:
            type: integer
          ttl:
            type: integer
        required: [max, ttl]
    required:
      - keys
      - lifetime
      - refresh
      - cache

  defaults:
    lifetime: 2592000
    refresh: 600
    cache:
      max: 1024
      ttl: 600000

exposition:
  /:identity:
    auth:id: identity
    auth:role: system:identity:tokens
    POST:
      map:authority: authority
      io:input: [lifetime, label, scopes, permissions]
      io:output: [kid, exp, token, label]
      endpoint: issue
