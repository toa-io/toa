properties:
  class:
    type: string
  resources:
    # `null` deploys the service without any, which every deployment has to state one way
    # or the other — see `migrations/263.md`.
    type: object
    nullable: true
    properties:
      cpu:
        type: array
        items:
          type: string
        minItems: 2
        maxItems: 2
      memory:
        type: array
        items:
          type: string
        minItems: 2
        maxItems: 2
  annotations:
    type: object
    patternProperties:
      ^.+$:
        type: string
  service:
    type: object
    properties:
      annotations:
        type: object
        patternProperties:
          ^.+$:
            type: string
  debug:
    type: boolean
  authentication:
    type: object
    properties:
      header:
        type: string
        minLength: 1
      attempts:
        type: integer
        minimum: 1
      interval:
        type: integer
        minimum: 1
    required:
      - header
    additionalProperties: false
  protocol:
    type: string
    enum: [h1, h2c]
  /: {}
  authorities:
    type: object
    patternProperties:
      ^.+$:
        type: string
type: object
required:
  - authorities
