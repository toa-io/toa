namespace: messages
name: messages

entity:
  schema:
    properties:
      sender:
        type: string
        default: id
      text:
        type: string
      timestamp:
        type: integer
      deleted:
        type: boolean
    type: object

operations:
  add:
    input:
      properties:
        sender:
          type: string
          default: .
        text:
          type: string
          default: .
        timestamp:
          type: string
          default: .
        free:
          type: boolean
        deleted:
          type: string
          default: .
      required:
        - sender
        - text
      type: object
    output:
      properties:
        id:
          type: string
          default: .
      required:
        - id
      type: object
    query: false
  get:
    output:
      properties:
        id:
          type: string
          default: .
        text:
          type: string
          default: .
        timestamp:
          type: string
          default: .
      required:
        - id
        - text
      type: object
  update:
    concurrency: none
    forward: transit
    input:
      properties:
        text:
          type: string
          default: .
      type: object
  change:
    forward: update
  find:
    output:
      type: array
    query: true
  transit:
    concurrency: none
    input:
      properties:
        sender:
          type: string
          default: .
        text:
          type: string
          default: .
      required:
        - sender
        - text
      type: object
    output:
      properties:
        ok:
          type: string
      required:
        - id
        - ok
      type: object
  assign:
    input:
      properties:
        text:
          type: string
          default: .
      type: object

configuration:
  schema:
    type: object
    properties:
      price:
        type: integer
        default: 1
