name: messages

entity:
  properties:
    watchers: &watchers
      type: array
      items:
        type: string
        maxLength: 32
    sender: &sender
      type: string
      maxLength: 32
    recipient: &recipient
      type: string
      maxLength: 32
    text: &text
      type: string
  required:
    - sender
    - recipient
    - text

operations:
  create:
    query: false
    forward: transit
    input:
      properties:
        watchers: *watchers
        sender: *sender
        recipient: *recipient
        text: *text
      type: object
      required:
        - sender
        - recipient
        - text
