$schema: https://json-schema.org/draft/2019-09/schema
$id: https://schemas.toa.io/0.0.0/manifest

definitions:
  name:
    type: string
    pattern: ^[a-zA-Z]+([_a-zA-Z0-9]*[a-zA-Z0-9]+)?$
  binding:
    type: string
    not:
      const: "@toa.io/bindings.loop" # loop is for system use only

type: object
properties:
  prototype:
    type: object
    nullable: true
    properties:
      prototype:
        $ref: "#/properties/prototype"
      path:
        type: string
      operations:
        type: object
        propertyNames:
          $ref: "#/definitions/name"
        patternProperties:
          ".*":
            type: object
            properties:
              bridge:
                $ref: "#/properties/bridge"

  path:
    type: string

  locator:
    type: object
    properties:
      id:
        type: string
        pattern: ^([a-zA-Z]+([_a-zA-Z0-9]*[a-zA-Z0-9]+)?)(\.([a-zA-Z]+([_a-zA-Z0-9]*[a-zA-Z0-9]+)?))$
      label:
        type: string
        pattern: ^([a-zA-Z]+([_a-zA-Z0-9]*[a-zA-Z0-9]+)?)(-([a-zA-Z]+([_a-zA-Z0-9]*[a-zA-Z0-9]+)?))*$

  name:
    type: string
    pattern: ^[a-zA-Z]([a-zA-Z0-9]{1,31})?$

  namespace:
    type: string
    pattern: ^[a-zA-Z]([a-zA-Z0-9]{1,31})?$
    not:
      oneOf:
        - const: "system"

  version:
    type: string

  build:
    type: object
    properties:
      image:
        type: string
      run:
        type: string

  entity:
    type: object
    properties:
      storage:
        type: string
      properties:
        type: object
        # a system property is named like any other, so nothing is enumerated beside them
        propertyNames:
          $ref: "#/definitions/name"
        additionalProperties:
          $ref: https://json-schema.org/draft/2019-09/schema
      required:
        type: array
        uniqueItems: true
        items:
          $ref: "#/definitions/name"
      blank:
        # what a record holds before anything is written to it; a system property is the
        # runtime's to write, so none may be named here
        type: object
        propertyNames:
          not:
            enum: [id, VERSION, CREATED, UPDATED, DELETED, REGION]
      migrations:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            # what a step means belongs to the storage, which is the only thing that reads it
            steps:
              type: array
            # the prototype it is inherited from; absent on the component's own
            prototype:
              type: string
          required: [id, steps]
          additionalProperties: false
      associated:
        type: boolean
      custom:
        type: boolean
    required: [properties]
    additionalProperties: false

  bindings:
    type: array
    uniqueItems: true
    items:
      $ref: "#/definitions/binding"

  bridge:
    type: string

  operations:
    type: object
    propertyNames:
      $ref: "#/definitions/name"
    patternProperties:
      ".*":
        type: object
        properties:
          type:
            enum:
              [
                transition,
                observation,
                assignment,
                computation,
                effect,
                unmanaged,
              ]
          scope:
            enum: [object, objects, changeset, stream, none]
          concurrency:
            enum: [none, retry]
          once:
            # the same call arriving twice changes state once; see documentation/inbox.md
            type: boolean
          stateful:
            # served by one particular process, which a call to it names; see documentation/stateful.md
            type: boolean
          forward:
            $ref: "#/definitions/name"
          bridge:
            type: string
          bindings:
            $ref: "#/properties/bindings"
          description:
            # what the operation is, for whoever reads it: a generated type, an OPTIONS, a model
            type: string
          input:
            $ref: https://json-schema.org/draft/2019-09/schema
          output:
            $ref: https://json-schema.org/draft/2019-09/schema
          errors:
            # what a reply may carry as a code: the error schema allows either
            type: array
            items:
              type: [string, integer]
          query:
            type: boolean
        required: [type, scope, bindings]
        allOf:
          - if: # transition
              properties:
                type:
                  const: transition
            then:
              properties:
                scope:
                  enum: [object, objects]
              if: # not query: false
                not:
                  properties:
                    query:
                      const: false
                  required: [query]
              then:
                required: [concurrency]
          - if: # transition and scope=objects
              properties:
                type:
                  const: transition
                scope:
                  const: objects
            then:
              properties:
                query:
                  not:
                    const: false
          - if: # not transition
              not:
                properties:
                  type:
                    const: transition
            then:
              properties:
                concurrency:
                  const: ~ # never pass
          - if: # neither a transition nor an assignment
              not:
                properties:
                  type:
                    enum: [transition, assignment]
            then:
              properties:
                # An operation that writes nothing has nothing to record. An effect writes, but
                # its write is get-or-create, so a second arrival of one writes nothing already —
                # and it writes in `acquire`, before its algorithm has run, so its reply is not
                # known where the record is made.
                once:
                  const: ~ # never pass
          - if: # commits more than one entity
              properties:
                type:
                  const: transition
                scope:
                  const: objects
            then:
              properties:
                # the reply is recorded, and over a set it is unbounded
                once:
                  const: ~ # never pass
          - if: # observation
              properties:
                type:
                  const: observation
            then:
              properties:
                scope:
                  enum: [object, objects, stream, none]
                query:
                  not:
                    const: false
          - if: # assignment
              properties:
                type:
                  const: assignment
            then:
              properties:
                scope:
                  enum: [changeset]
          - if: # computation
              properties:
                type:
                  enum: [computation, unmanaged]
            then:
              properties:
                scope:
                  const: none
                query:
                  const: false
          - if: # effect
              properties:
                type:
                  const: effect
            then:
              properties:
                scope:
                  enum: [object, objects, stream, none]
        additionalProperties: false
    additionalProperties: false

  events:
    type: object
    propertyNames:
      $ref: "#/definitions/name"
    patternProperties:
      ".*":
        type: object
        properties:
          bridge:
            type: string
          path:
            type: string
          binding:
            $ref: "#/definitions/binding"
          conditioned:
            type: boolean
          subjective:
            type: boolean
        required: [bridge, path]
        additionalProperties: false

  receivers:
    type: object
    patternProperties:
      ".*":
        type: object
        properties:
          operation:
            $ref: "#/definitions/name"
          bridge:
            type: string
          binding:
            type: string
          source:
            $ref: "#/definitions/name"
            not:
              const: context
          path:
            type: string
          conditioned:
            type: boolean
          adaptive:
            type: boolean
          arguments:
            type: array
        required: [operation]
        additionalProperties: false

  guards:
    type: object
    patternProperties:
      ".*":
        type: object
        properties:
          bridge: { type: string }
          path: { type: string }
        required: [bridge, path]
        additionalProperties: false

  extensions:
    type: object

additionalProperties: false
