name: pots

entity:
  schema:
    properties:
      title:
        type: string
        maxLength: 64
      volume:
        type: number
        exclusiveMinimum: 0
        maximum: 1000
      temperature:
        type: number
        exclusiveMinimum: 0
        maximum: 300
    type: object
    required:
      - title
      - volume
  index:
    text:
      title: text

operations:
  create:
    description: Put a pot on to brew.
    query: false
    forward: transit
    input:
      properties:
        temperature:
          type: string
          default: .
        title:
          type: string
          default: .
        volume:
          type: string
          default: .
      type: object
      required:
        - title
        - volume
    errors:
      - NO_WAY
      - WONT_CREATE
  transit:
    concurrency: retry
    input:
      properties:
        title:
          type: string
          default: .
        volume:
          type: string
          default: .
        temperature:
          type: string
          default: .
      type: object
  observe:
    output:
      properties:
        id:
          type: string
        title:
          type: string
        volume:
          type: number
        temperature:
          type: number
      type: object
  enumerate:
    description: Every pot there is.
    output:
      type: array
      items:
        properties:
          id:
            type: string
            default: .
          title:
            type: string
            default: .
          volume:
            type: string
            default: .
          temperature:
            type: string
            default: .
        type: object
        required:
          - id
          - title
          - volume
