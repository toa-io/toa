namespace: dummies
name: a

entity:
  schema:
    properties:
      title:
        type: string
      length:
        type: integer
    required:
      - title
    type: object
  associated: true

operations:
  transit:
    concurrency: retry
    input:
      properties:
        title:
          type: string
          default: .
      type: object
  create:
    forward: transit
    query: false
    input:
      properties:
        title:
          type: string
          default: .
        length:
          type: string
          default: .
      type: object

receivers:
  messages.messages.created: transit

extensions:
  exposition:
    /:
      POST: create
    /:id:
      GET: observe
