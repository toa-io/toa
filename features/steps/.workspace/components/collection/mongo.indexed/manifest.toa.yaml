namespace: mongo
name: indexed

entity:
  properties:
    birthday:
      type: number
    weight:
      type: number
    tag:
      type: string
    name:
      type: string
    email:
      type: string
  required:
    - name
    - email

operations:
  transit:
    concurrency: retry
    input:
      properties:
        name:
          type: string
        email:
          type: string
      type: object
