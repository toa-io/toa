namespace: realtime
name: streams

operations:
  create:
    input:
      properties:
        key:
          type: string
        token:
          type: string
      type: object
  push:
    output: { type: 'null' }
    bindings: ~ # only for internal use
    input:
      properties:
        data: {}
        key:
          type: string
        event:
          type: string
      type: object
      required:
        - key
        - event

configuration:
  schema:
    properties:
      maxlen:
        type: number
      expire:
        type: number
    type: object
    # both have defaults, so the component reads them without checking
    required: [maxlen, expire]

  defaults:
    maxlen: 1000
    expire: 300

state: ~
stash: ~

exposition:
  /:key:
    auth:id: key
    GET:
      endpoint: create
      # an effect: opening a stream is not a read, and `GET` is the method a client opens one with
      io:readonly: false
