namespace: interop
name: demo

operations:
  format:
    bridge: '@toa.io/bridges.bash'
    input:
      properties:
        greeting:
          type: string
          default: Hello
        name:
          type: string
      type: object
      required:
        - name
  greet:
    input:
      properties:
        name:
          type: string
        language:
          type: string
          enum:
            - en
            - fr
      type: object
      required:
        - name
        - language
