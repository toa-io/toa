# manifest.toa.yaml chronicles declaration, normalised: the events whose renderings are rows of
# the log, and the event whose payload is the entity as it stands
type: object
properties:
  events:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: ^[a-zA-Z][a-zA-Z0-9]*$
  state:
    type: string
    pattern: ^[a-zA-Z][a-zA-Z0-9]*$
  identity:
    description: The property of the payloads that names the identity a row is of; null, none
    type: [string, "null"]
    pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
required: [events]
additionalProperties: false
