name: pots

entity:
  properties:
    title: &title
      type: string
      maxLength: 64
    volume: &volume
      type: number
      exclusiveMinimum: 0
      maximum: 1000
    temperature: &temperature
      type: number
      exclusiveMinimum: 0
      maximum: 300
  required:
    - title
    - volume

operations:
  create:
    description: Put a pot on to brew.
    query: false
    forward: transit
    input:
      properties:
        temperature: *temperature
        title: *title
        volume: *volume
      type: object
      required:
        - title
        - volume
    errors:
      - NO_WAY
      - WONT_CREATE
  transit:
    concurrency: retry
    once: true
    input:
      properties:
        title: *title
        volume: *volume
        temperature: *temperature
      type: object
  observe:
    output:
      properties:
        id:
          type: string
        title:
          type: string
        volume:
          type: number
        temperature:
          type: number
      type: object
  enumerate:
    description: Every pot there is.
    output:
      type: array
      items:
        properties:
          id:
            type: string
            pattern: ^[a-fA-F0-9]{32}$
          title: *title
          volume: *volume
          temperature: *temperature
        type: object
        required:
          - id
          - title
          - volume
