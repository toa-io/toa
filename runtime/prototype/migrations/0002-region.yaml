# 1.0.0-alpha.XXX added `REGION`, the region that last wrote a record, as the rank that region
# was declared with. A record written before it holds none.
#
# The backfill is not tidiness. A merge supersedes a stored record of the same version only
# where its `REGION` is greater, and `$gt` matches no document that lacks the field — so a
# record without one would lose no tie, and would beat every equal-version write from anywhere,
# silently and for good.
#
# `0` is the first region, which is the one an existing database is deployed as: its records
# were written by whatever region it is now becoming, and that region is declared first. Every
# record has a `VERSION`, so that is what says whether one has been converted.
- update:
    filter: { REGION: { $exists: false } }
    update:
      $set:
        REGION: 0
