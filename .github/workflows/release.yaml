name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - release
      - alpha

  workflow_dispatch:
    inputs:
      from-package:
        description: Publish versions already in package.json (no version bump)
        required: true
        default: true
        type: boolean
      dist-tag:
        description: npm dist-tag for from-package publish
        required: true
        default: alpha
        type: string

permissions: {}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write

    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm
        run: npm i -g npm@latest

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import GPG key
        if: github.event_name != 'workflow_dispatch' || inputs.from-package == false
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.TOABOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.TOABOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.TOABOT_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ steps.gpg.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.gpg.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.gpg.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.gpg.outputs.email }}
          HUSKY: 0
        run: |
          npm ci

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.from-package }}" = "true" ]; then
            npx lerna publish from-package --dist-tag ${{ inputs.dist-tag }} --yes
          elif [ "${{ github.base_ref }}" = "release" ]; then
            npx lerna publish --conventional-graduate --no-commit-hooks --no-changelog --yes --message "ci: %s" --sign-git-commit
          else
            npx lerna publish --conventional-prerelease --preid alpha --dist-tag alpha --no-commit-hooks --no-changelog --yes --message "ci: %s" --sign-git-commit
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # npm publish can succeed before the version is visible to subsequent
      # registry reads (CDN lag). Poll instead of a fixed sleep.
      - name: Wait for npm
        run: |
          VERSION=$(node -p "require('./runtime/runtime/package.json').version")
          for i in $(seq 1 36); do
            if npm view "@toa.io/runtime@$VERSION" version >/dev/null 2>&1; then
              echo "@toa.io/runtime@$VERSION is available"
              exit 0
            fi
            echo "waiting for @toa.io/runtime@$VERSION ($i/36)"
            sleep 5
          done
          echo "::error::timed out waiting for @toa.io/runtime@$VERSION on npm"
          exit 1

      - name: Publish runtime image
        run: |
          VERSION=$(node -p "require('./runtime/runtime/package.json').version")
          IMAGE=ghcr.io/toa-io/runtime
          TAGS=(--tag "$IMAGE:$VERSION")

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAGS+=(--tag "$IMAGE:${{ inputs.dist-tag }}")
          elif [ "${{ github.base_ref }}" = "release" ]; then
            TAGS+=(--tag "$IMAGE:latest")
          else
            TAGS+=(--tag "$IMAGE:alpha")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            "${TAGS[@]}" \
            --push \
            -f operations/image/runtime.Dockerfile \
            operations/image

      - name: Push to dev branch
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.TOABOT_GITHUB_TOKEN }}
          HUSKY: 0
        run: |
          git fetch
          git checkout dev
          # package-lock.json has -merge in .gitattributes, so concurrent
          # lockfile edits (e.g. Dependabot) always conflict with the release bump.
          if ! git merge ${{ github.base_ref }}; then
            git checkout --ours package-lock.json
            npm install --package-lock-only --ignore-scripts
            git add package-lock.json
            git -c core.hooksPath=/dev/null commit --no-edit
          fi
          git push --all origin --no-verify
