services:
  verdaccio:
    image: verdaccio/verdaccio:5.10.2
    ports: ["4873:4873"]
  rabbitmq:
    image: rabbitmq:3.10.0-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    environment:
      RABBITMQ_DEFAULT_USER: developer
      RABBITMQ_DEFAULT_PASS: secret
  mongodb:
    image: mongo:8.0.16
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--keyFile",
        "/etc/mongo-keyfile/keyfile",
      ]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: developer
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - ./.mongo-keyfile:/etc/mongo-keyfile/keyfile:ro
    healthcheck:
      test: >
        bash -lc 'mongosh "mongodb://developer:secret@localhost:27017/admin?directConnection=true" --quiet
        --eval "try{rs.status().ok}catch(e){rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:27017\"}]});} ; db.runCommand({ping:1}).ok" | grep 1'
      interval: 5s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:14.4
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d integration -U developer"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: integration
  redis0:
    image: redis:7.0.11
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
  redis1:
    image: redis:7.0.11
    ports:
      - "6378:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
  redis2:
    image: redis:7.0.11
    ports:
      - "6377:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
  http-echo:
    image: ealen/echo-server:0.8.12
    ports: ["8888:80"]
  localstack:
    image: localstack/localstack
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      - DEBUG=1
      - SERVICES=s3
      - ALLOW_NONSTANDARD_REGIONS=1
      - AWS_ACCESS_KEY_ID=developer
      - AWS_SECRET_ACCESS_KEY=secret
      - AWS_DEFAULT_REGION=us-west-1
    healthcheck:
      test:
        [
          "CMD",
          "awslocal",
          "s3api",
          "wait",
          "bucket-exists",
          "--bucket",
          "test-bucket",
        ]
    volumes:
      - "./integration/scripts/localstack.sh:/etc/localstack/init/ready.d/init-aws.sh" # ready hook
      - "/var/run/docker.sock:/var/run/docker.sock"
  tempo:
    image: grafana/tempo:3.0.2
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200" # Tempo API
      - "4318:4318" # OTLP/HTTP
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:13.1.3
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
