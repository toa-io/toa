name: bench

entity:
  properties:
    title: &string
      type: string
    summary: *string
    status: *string
    owner: *string
    region: *string
    language: *string
    url: *string
    rank: &integer
      type: integer
    count: *integer
    score: &number
      type: number
    price: *number
    due: *number
    public: &boolean
      type: boolean
    archived: *boolean
    tags:
      type: array
      items: *string

operations:
  transit:
    concurrency: retry
    query: false
    input:
      type: object
      properties: &fields
        title: *string
        summary: *string
        status: *string
        owner: *string
        region: *string
        language: *string
        url: *string
        rank: *integer
        count: *integer
        score: *number
        price: *number
        due: *number
        public: *boolean
        archived: *boolean
        tags:
          type: array
          items: *string
      required: [title]
  observe:
    output:
      type: object
      properties:
        <<: *fields
        id: *string
  enumerate:
    output:
      type: array
      items:
        type: object
        properties:
          <<: *fields
          id: *string
  small:
    output:
      type: object
      properties:
        id: *string
        title: *string
        rank: *integer
        public: *boolean
        tags:
          type: array
          items: *string
  user:
    input:
      type: object
      properties:
        user: *string
      required: [user]
    output:
      type: object
      properties:
        id: *string
  chain:
    output:
      type: object
      properties:
        n: *integer

exposition:
  /:
    io:output: true
    /small:
      anonymous: true
      GET: small
    /chain:
      anonymous: true
      GET: chain
    /items:
      anonymous: true
      GET:
        endpoint: enumerate
        query:
          limit:
            value: 1000
            range: [1, 1000]
      POST:
        io:input: [title, summary, status, owner, region, language, url, rank, count, score, price, due, public, archived, tags]
        io:output: [id]
        endpoint: transit
      /:id:
        GET: observe
    /users/:user:
      auth:id: user
      GET: user
    /role:
      auth:role: bench
      GET: small
    /tools:
      anonymous: true
      mcp:tool: true
