namespace: identity
name: federation

entity:
  associated: true
  schema:
    type: object
    properties:
      authority:
        description: The authority token is valid for
        type: string
      iss:
        description: The issuer, or signer, of the token, URI like `https://accounts.google.com`
        type: string
      sub:
        description: The ID that represents the principal making the request
        type: string
    required:
      - authority
      - iss
      - sub
    additionalProperties: false
  unique:
    token: [authority, iss, sub]

operations:
  transit:
    concurrency: retry
    input:
      authority*: string
      iss*: string
      sub*: string
  incept:
    input:
      authority: string
      credentials*: string
      id: string
    output:
      id: string
  authenticate:
    input:
      authority*: string
      credentials*: string
    output:
      properties:
        identity:
          properties:
            id:
              type: string
            claims: &claims
              properties:
                iss:
                  type: string
                aud:
                  type: string
                sub:
                  type: string
              additionalProperties: true
              required:
                - iss
                - sub
          required:
            - id
            - claims
    errors:
      - ERR_NOT_FOUND
  decode:
    input: string
    output: *claims

exposition:
  /:
    /:id:
      POST:
        map:authority: authority
        auth:id: id
        io:input: [credentials]
        io:output: false
        endpoint: incept

configuration:
  schema:
    type: object
    properties:
      trust:
        type: array
        items:
          title: Trusted Identity Providers
          type: object
          additionalProperties: false
          properties:
            iss:
              description: Allowed values for a token `iss` field
              type: string
              format: uri
            aud:
              description: Acceptable `aud` value(s). Required for Authorization Code Flow.
              anyOf:
                - type: string
                - type: array
                  items: { type: string }
                  uniqueItems: true
                  minItems: 1
            secret:
              description: Client secret for the Identity Provider. Required for Authorization Code Flow.
              type: string
          required:
            - iss
        default: []
      principal:
        title: Principal
        description: Subject that will be assigned the `system` Role
        type: object
        properties:
          iss:
            type: string
            format: uri
          sub:
            type: string
        required:
          - iss
          - sub
        additionalProperties: false
      assert:
        title: Implicitly incept Identity for new credentials
        type: boolean
        default: true
    additionalProperties: false

stash: ~
