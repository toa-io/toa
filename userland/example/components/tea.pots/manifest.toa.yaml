name: pots
namespace: tea

entity:
  storage: mongodb
  properties:
    volume: &volume
      type: number
    booked: &booked
      type: boolean
    material: &material
      type: string
      enum:
        - glass
        - ceramic
        - steel
  required:
    - material
  blank:
    booked: false

operations:
  transit:
    concurrency: none
    input:
      properties:
        material: *material
        volume: *volume
        booked: *booked
      type: object
  same:
    input: *material
    output:
      type: array

receivers:
  store.orders.created:
    operation: transit
    binding: amqp # avoid discovery

configuration:
  schema:
    type: object
    properties:
      step:
        type: number
  defaults:
    step: 0.5
