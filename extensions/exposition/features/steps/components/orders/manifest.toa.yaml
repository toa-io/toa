name: orders

entity:
  properties:
    title:
      type: string
    volume:
      type: number
    price:
      type: number
  required:
    - title
    - volume

operations:
  create:
    concurrency: retry
    query: false
    input:
      properties:
        title:
          type: string
          default: .
        volume:
          type: string
          default: .
      type: object
      required:
        - title
        - volume
