name: telemetry

telemetry:
  metrics:
    conversions:
      type: counter
      labels:
        currency: [EUR, USD]

operations:
  convert:
    input:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
      required: [amount, currency]
    output:
      type: number
  trace:
    input:
      properties:
        value:
          type: number
      type: object
    output:
      type: number
  log:
    input:
      type: object
      properties:
        level:
          type: string
          enum:
            - debug
            - info
            - warn
            - error
        message:
          type: string
        attributes:
          type: object
          additionalProperties: true
      required:
        - level
        - message
