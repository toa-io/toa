type: object
properties:
  provider:
    const: cloudinary
  environment:
    type: string
  type:
    enum:
      - image
      - video
  prefix:
    type: string
  eager:
    type: array
    items: &transformation
      type: object
  transformations:
    type: array
    items:
      type: object
      properties:
        extension:
          type: string
        transformation:
          anyOf:
            - *transformation
            - type: array
              items: *transformation
        optional:
          type: boolean
      required:
        - extension
        - transformation
required:
  - environment
  - type
additionalProperties: false
