name: outbox
namespace: mongo

entity:
  storage: mongodb
  properties:
    foo:
      type: integer
    bar:
      type: string
  blank:
    foo: 0

operations:
  transit:
    concurrency: retry
    input:
      properties:
        foo:
          type: string
          default: .
        bar:
          type: string
          default: .
      type: object
  assign:
    input:
      properties:
        foo:
          type: string
          default: .
        bar:
          type: string
          default: .
      type: object
  bump:
    concurrency: retry
    input:
      properties:
        inc:
          type: integer
      type: object
